<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Streamline Workflows Film</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html,body{margin:0;background:#1E3B2C;overflow:hidden}
  #root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#1E3B2C;transform-origin:0 0}
  #root canvas{position:absolute;left:0;top:0}
  #stageWrap{position:absolute;inset:0;perspective:1900px;perspective-origin:50% 46%;pointer-events:none}
  #ui{left:50% !important;top:50% !important;width:1600px;height:900px;display:none;
      box-shadow:0 90px 200px rgba(0,0,0,.45),0 0 0 1px rgba(26,26,23,.08);transform-origin:50% 50%}
</style>
</head>
<body>
<div id="root">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="stageWrap"><canvas id="ui" width="2400" height="1350"></canvas></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
</div>
<script>
/* =====================================================================
   STREAMLINE WORKFLOWS — 60s brand film (v3).
   Hook: friction at full volume. Then: fewer moving parts.
   Every frame is a pure function of t.
   ===================================================================== */
const W=1920,H=1080,CX=960,CY=540,DURATION=60;
const bgC=document.getElementById('bg'),fxC=document.getElementById('fx'),uiC=document.getElementById('ui');
const bg=bgC.getContext('2d'),fx=fxC.getContext('2d'),ui=uiC.getContext('2d');
const UIS=1.5;

/* Brand guidelines v1.0 */
const B={forest:'#1E3B2C',forest2:'#27493A',cream:'#EFEBE1',ember:'#C2410C',sage:'#8FBF9F',ink:'#1A1A17',slate:'#4A4A42',rule:'#DED8CA',paper:'#F7F4EC',muted:'#7A7A6E',white:'#FFFFFF'};
const F={a:'Archivo',s:'"Instrument Serif"',m:'"JetBrains Mono"'};
const COPY={url:'streamline-workflows-site.vercel.app',prompt:'every business runs on workflows.'};

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,k)=>a+(b-a)*k;
const inv=(a,b,x)=>clamp((x-a)/(b-a));
const frac=x=>x-Math.floor(x);
const E={
  lin:x=>x,inCubic:x=>x*x*x,outCubic:x=>1-(1-x)**3,inOutCubic:x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2,
  outQuart:x=>1-(1-x)**4,outQuint:x=>1-(1-x)**5,
  outExpo:x=>x>=1?1:1-2**(-10*x),inExpo:x=>x<=0?0:2**(10*x-10),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?2**(20*x-10)/2:(2-2**(-20*x+10))/2,
  outBack:x=>{const c1=1.4,c3=c1+1;return 1+c3*(x-1)**3+c1*(x-1)**2},
  inOutSine:x=>-(Math.cos(Math.PI*x)-1)/2,
};
const spring=(a,f=1.6,d=7)=>a<=0?0:1-Math.exp(-d*a)*Math.cos(f*Math.PI*2*a);
const hash=n=>frac(Math.sin(n*127.1+311.7)*43758.5453);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function A(h,a){const[r,g,b]=rgb(h);return`rgba(${r},${g},${b},${a})`}
function mix(h1,h2,k,a=1){const p=rgb(h1),q=rgb(h2);return`rgba(${p.map((v,i)=>Math.round(lerp(v,q[i],clamp(k)))).join(',')},${a})`}

/* ---------- type ---------- */
function font(ctx,size,fam=F.a,weight=400,italic=false,ls=0){ctx.font=`${italic?'italic ':''}${weight} ${size}px ${fam}`;ctx.letterSpacing=ls+'px'}
function measure(ctx,str,o){font(ctx,o.size,o.fam||F.a,o.weight??400,o.italic,o.ls||0);return ctx.measureText(str).width}
function reveal(ctx,str,x,y,o){
  const{size=100,fam=F.a,weight=400,italic=false,ls=0,fill=B.ink,align='left',t0=0,st=.03,dur=.8,rise=1.05,
    ez=E.outQuint,out=null,outDur=.45,outSt=.012,clip=true,alpha=1,t=T}=o;
  font(ctx,size,fam,weight,italic,ls);
  const w=ctx.measureText(str).width;
  const x0=align==='center'?x-w/2:align==='right'?x-w:x;
  if(t<t0-.01)return w;
  ctx.save();
  if(clip){ctx.beginPath();ctx.rect(x0-size,y-size*1.08,w+size*2,size*1.42);ctx.clip()}
  ctx.fillStyle=fill;ctx.textBaseline='alphabetic';ctx.textAlign='left';
  for(let i=0;i<str.length;i++){
    const ch=str[i];if(ch===' ')continue;
    const xi=x0+ctx.measureText(str.slice(0,i)).width;
    const p=ez(inv(t0+i*st,t0+i*st+dur,t));
    let dy=(1-p)*size*rise,a=clamp(p*1.5);
    if(out!=null){const q=E.inCubic(inv(out+i*outSt,out+i*outSt+outDur,t));dy-=q*size*rise;a*=1-q}
    if(a<=.002)continue;
    ctx.globalAlpha=a*alpha;ctx.fillText(ch,xi,y+dy);
  }
  ctx.restore();return w;
}
function runs(ctx,parts,cx,y,common){
  const ws=parts.map(p=>measure(ctx,p.s,{...common,...p}));const tot=ws.reduce((a,b)=>a+b,0);let x=cx-tot/2;
  parts.forEach((p,i)=>{reveal(ctx,p.s,x,y,{...common,...p});x+=ws[i]});return tot;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function dot(ctx,x,y,r,col,a=1){if(r<=.05||a<=0)return;const ga=ctx.globalAlpha;ctx.globalAlpha=ga*a;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=ga}
function pill(ctx,l,r_,y,h,col,a=1){if(r_-l<.5||a<=0)return;const ga=ctx.globalAlpha;ctx.globalAlpha=ga*a;ctx.fillStyle=col;rr(ctx,l,y-h/2,Math.max(h,r_-l),h,h/2);ctx.fill();ctx.globalAlpha=ga}
function glyph(ctx,kind,s,col,lw=.09){
  ctx.save();ctx.scale(s,s);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
  const P=(pts,close=true,fill=false)=>{ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(close)ctx.closePath();fill?ctx.fill():ctx.stroke()};
  switch(kind){
    case'bolt':P([[.08,-.46],[-.26,.06],[-.01,.06],[-.1,.46],[.27,-.09],[.02,-.09]],true,true);break;
    case'cond':P([[0,-.4],[.4,0],[0,.4],[-.4,0]]);ctx.beginPath();ctx.arc(0,0,.08,0,7);ctx.fill();break;
    case'send':P([[-.36,0],[.3,0]],false);P([[.08,-.22],[.32,0],[.08,.22]],false);break;
    case'mail':rr(ctx,-.4,-.28,.8,.56,.08);ctx.stroke();P([[-.36,-.22],[0,.04],[.36,-.22]],false);break;
    case'chat':rr(ctx,-.4,-.32,.8,.52,.14);ctx.stroke();P([[-.18,.2],[-.26,.38],[.0,.2]],false);for(let k=-1;k<=1;k++){ctx.beginPath();ctx.arc(k*.16,-.06,.05,0,7);ctx.fill()}break;
    case'doc':P([[-.3,-.42],[.12,-.42],[.3,-.24],[.3,.42],[-.3,.42]]);P([[-.14,-.06],[.16,-.06]],false);P([[-.14,.1],[.16,.1]],false);P([[-.14,.26],[.06,.26]],false);break;
    case'cal':rr(ctx,-.38,-.32,.76,.7,.08);ctx.stroke();P([[-.38,-.12],[.38,-.12]],false);P([[-.18,-.44],[-.18,-.24]],false);P([[.18,-.44],[.18,-.24]],false);break;
    case'db':ctx.beginPath();ctx.ellipse(0,-.28,.34,.12,0,0,7);ctx.stroke();P([[-.34,-.28],[-.34,.28]],false);P([[.34,-.28],[.34,.28]],false);
      ctx.beginPath();ctx.ellipse(0,.28,.34,.12,0,0,Math.PI);ctx.stroke();ctx.beginPath();ctx.ellipse(0,0,.34,.12,0,0,Math.PI);ctx.stroke();break;
    case'card':rr(ctx,-.42,-.28,.84,.56,.08);ctx.stroke();ctx.fillRect(-.42,-.16,.84,.1);break;
    case'bell':ctx.beginPath();ctx.moveTo(-.3,.22);ctx.quadraticCurveTo(-.24,.12,-.24,-.04);ctx.arc(0,-.04,.24,Math.PI,0);ctx.quadraticCurveTo(.24,.12,.3,.22);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.arc(0,.32,.07,0,7);ctx.fill();break;
    case'grid':rr(ctx,-.38,-.34,.76,.68,.06);ctx.stroke();P([[-.38,-.1],[.38,-.1]],false);P([[-.38,.12],[.38,.12]],false);P([[-.12,-.34],[-.12,.34]],false);P([[.12,-.34],[.12,.34]],false);break;
    case'check':P([[-.3,0],[-.08,.22],[.32,-.2]],false);break;
    case'clock':ctx.beginPath();ctx.arc(0,0,.36,0,7);ctx.stroke();P([[0,-.2],[0,0],[.16,.1]],false);break;
    case'box':P([[-.36,-.18],[0,-.38],[.36,-.18],[.36,.22],[0,.42],[-.36,.22]]);P([[-.36,-.18],[0,.02],[.36,-.18]],false);P([[0,.02],[0,.42]],false);break;
  }
  ctx.restore();
}
function cursor(ctx,x,y,s=1,a=1){
  ctx.save();ctx.translate(x,y);ctx.scale(1.35*s,1.35*s);ctx.globalAlpha=a;
  ctx.beginPath();[[0,0],[0,26],[7,20],[12,31],[16,29],[11,18.5],[20,18.5]].forEach(([px,py],i)=>i?ctx.lineTo(px,py):ctx.moveTo(px,py));ctx.closePath();
  ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=10;ctx.shadowOffsetY=4;ctx.fillStyle=B.ink;ctx.fill();ctx.shadowColor='transparent';
  ctx.lineWidth=1.6;ctx.strokeStyle=B.white;ctx.stroke();ctx.restore();
}

/* ---------- the mark (viewBox 100: nodes r7 at cols 18/44/70, rows 22/50/78; bar 37→84) ---------- */
const MK_DOTS=[[18,22],[44,22],[70,22],[18,50],[18,78],[44,78],[70,78]];
function lockGeom(ctx,size,cx,cy){
  const S=size*.76/44, tw=measure(ctx,'Streamline',{size,weight:700,ls:-size*.035}), gap=size*28/44;
  const total=73*S+gap+tw, left=cx-total/2;
  return{S,size,cy,mx:left+39*S,my:cy,textX:left+73*S+gap};
}
function drawLockText(ctx,G,t0,{out=null,t=T,name=B.forest,sub=B.muted}={}){
  const size=G.size;
  reveal(ctx,'Streamline',G.textX,G.cy-.1*size,{size,weight:700,ls:-size*.035,fill:name,t0,st:.035,dur:.8,out,t});
  reveal(ctx,'WORKFLOWS',G.textX+2,G.cy+.37*size,{size:size*.341,fam:F.m,ls:size*.341*.3,fill:sub,t0:t0+.35,st:.04,dur:.6,out:out!=null?out+.05:null,t});
}
function drawMark(ctx,M0x,M0y,S,{dotCol=B.forest,barCol=B.ember,sc=[1,1,1,1,1,1,1],barL=37,barR=84,alpha=1}={}){
  MK_DOTS.forEach(([u,v],i)=>dot(ctx,M0x+(u-50)*S,M0y+(v-50)*S,7*S*sc[i],dotCol,alpha));
  if(barR>barL)pill(ctx,M0x+(barL-50)*S,M0x+(barR-50)*S,M0y,14*S,barCol,alpha);
}

const GRAIN=[...Array(6)].map((_,k)=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const d=g.createImageData(256,256);const r=rng(99+k);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return c});
let T=0,FI=0;

/* =====================================================================
   GROUND
   ===================================================================== */
function onForest(t){return t<13.2||(t>=21.4&&t<29.2)||(t>=33.8&&t<38)||(t>=47.65&&t<53.7)}
function drawBG(t){
  bg.setTransform(1,0,0,1,0,0);bg.globalAlpha=1;
  bg.fillStyle=(onForest(t)||(t>=38&&t<43))&&!(t>=47.35&&t<54)?B.forest:B.cream;bg.fillRect(0,0,W,H);
  if(t<13.2){ // hook atmosphere
    const chaos=inv(3.6,4.2,t)*(1-inv(12.4,13.2,t));
    const g=bg.createRadialGradient(CX+Math.sin(t*.3)*200,CY-120,0,CX,CY,950);
    g.addColorStop(0,chaos>.01?mix(B.forest2,'#5A2A12',chaos*.55,.9):A(B.forest2,.9));g.addColorStop(1,'rgba(0,0,0,0)');bg.fillStyle=g;bg.fillRect(0,0,W,H);
    const off=(t*10)%48;bg.fillStyle=A(B.cream,.06);
    for(let x=-48+off;x<W+48;x+=48)for(let y=-48+off*.5;y<H+48;y+=48)bg.fillRect(x,y,2,2);
  }
  if(t>=47.35&&t<54.0){ // v2 device ground
    bg.fillStyle=B.forest;
    if(t<47.95){const k=E.inOutExpo(inv(47.35,47.95,t));bg.fillRect(0,H*(1-k),W,H*k)}
    else if(t<53.4)bg.fillRect(0,0,W,H);
    else{const h=H*(1-E.inOutExpo(inv(53.4,54.0,t)));const c=CY-70*E.inOutExpo(inv(53.35,54.25,t));bg.fillRect(0,c-h/2,W,h)}
  }
}

/* =====================================================================
   00 PROLOGUE (0–4)
   ===================================================================== */
function sPrologue(t){
  const k3=inv(3.0,4.0,t),fade=1-inv(3.85,4.15,t);
  const L=E.inOutCubic(inv(1.9,3.0,t))*1150;
  bg.save();bg.globalAlpha=fade;
  if(L>1){
    for(let j=0;j<7;j++){
      if(j>0&&k3<=0)break;
      bg.beginPath();
      for(let x=-L;x<=L;x+=8){
        const env=Math.sin(Math.PI*(x+L)/(2*L));
        const calm=Math.sin(x*.008-t*4)*22*env;
        const ch=k3*k3*(Math.sin(x*.021*(1+j*.35)+t*(9+j)+j*2)*110+Math.sin(x*.063+j*5-t*14)*46)*env*(j===0?.5:1);
        const y=CY+calm+ch*(1+j*.12);
        x===-L?bg.moveTo(CX+x,y):bg.lineTo(CX+x,y);
      }
      const g=bg.createLinearGradient(CX-L,0,CX+L,0);
      if(j===0){g.addColorStop(0,mix(B.sage,B.ember,k3));g.addColorStop(.5,mix(B.cream,B.ember,k3*.7));g.addColorStop(1,mix(B.sage,B.ember,k3))}
      else{g.addColorStop(0,A(B.ember,.9));g.addColorStop(1,A(B.cream,.5))}
      bg.strokeStyle=g;bg.lineWidth=j===0?3:1.6;bg.globalAlpha=fade*(j===0?1:k3*.85);bg.stroke();
    }
  }
  bg.globalAlpha=fade;
  for(let b=.5;b<4;b+=.5){const a=t-b;if(a>0&&a<.9){bg.strokeStyle=A(B.sage,(1-a/.9)*.5);bg.lineWidth=1.5;bg.beginPath();bg.arc(CX,CY,8+E.outCubic(a/.9)*110,0,7);bg.stroke()}}
  const dr=9*clamp(spring(t-.2,1.4,6),0,1.4);
  const jx=k3*(hash(FI)-.5)*18,jy=k3*(hash(FI+7)-.5)*18;
  if(dr>0){bg.fillStyle=B.cream;bg.beginPath();bg.arc(CX+jx,CY+jy,dr,0,7);bg.fill()}
  bg.restore();
  const s=COPY.prompt,n=Math.floor(inv(.6,1.85,t)*s.length);
  if(t>.45){
    font(fx,34,F.m,400,false,0);
    const full=fx.measureText('›  '+s).width,x0=CX-full/2,y=CY-110;
    const shown='›  '+s.slice(0,n);
    const draw=(dx,col)=>{fx.fillStyle=col;fx.fillText(shown,x0+dx,y)};
    fx.save();fx.globalAlpha=fade*clamp((t-.45)/.2);
    if(k3>0){draw(k3*22*(hash(FI*3)-.2),A(B.ember,.8));draw(-k3*22*hash(FI*5),A(B.sage,.8))}
    draw(0,A(B.cream,.85));
    fx.fillStyle=B.ember;fx.fillText('›',x0,y);
    if(n<s.length||Math.floor(t*2.2)%2===0){const cw=fx.measureText(shown).width;fx.fillStyle=B.ember;fx.fillRect(x0+cw+6,y-28,16,34)}
    fx.restore();
  }
}

/* =====================================================================
   01 FRICTION (4–13.2)
   ===================================================================== */
const CH_NODES=(()=>{const r=rng(7);return[...Array(46)].map(()=>({x:r()*W,y:r()*H,ax:30+r()*90,ay:30+r()*90,fx:.3+r()*1.1,fy:.3+r()*1.1,p:r()*6.28}))})();
const CH_CARDS=(()=>{
  const list=[
    ['Quotes rebuilt in three systems','SALES · 2m ago','doc',3],
    ['Where is the latest job sheet?','CHAT · now','chat',12],
    ['Reporting due tonight — again','REMINDER · 9:00','bell',0],
    ['Order #1042 retyped (again)','OPS · 1m','grid',0],
    ['Approval stuck · 3 days','APPROVALS','doc',5],
    ['Copy row 48 into the CRM','TODO · overdue','grid',0],
    ['Who owns this handoff?','CHAT · #ops','chat',27],
    ['Invoice #2291 needs sign-off','FINANCE','card',2],
    ['Job status: unknown','OPS','box',1],
    ['Update the tracker (again)','TODO','grid',0],
    ['Can you resend that?','MAIL · 4m ago','mail',8],
    ['14 unread in #ops','CHAT','chat',14],
    ['Which version is final??','DOCS','doc',0],
    ['Sync to discuss the sync','CALENDAR','cal',0],
    ['Export, paste, reformat','SHEETS','grid',0],
    ['Following up on my follow-up','MAIL','mail',6],
  ];
  const r=rng(11);
  const spots=[[.2,.18],[.72,.14],[.08,.62],[.78,.7],[.42,.08],[.6,.86],[.18,.88],[.86,.38],[.02,.34],[.5,.74],[.3,.5],[.66,.42],[.12,.08],[.82,.9],[.36,.3],[.54,.2]];
  return list.map((c,i)=>({title:c[0],sub:c[1],icon:c[2],badge:c[3],
    x:spots[i][0]*W+(r()-.5)*60,y:spots[i][1]*H+(r()-.5)*40,rot:(r()-.5)*.14,t0:4.15+i*.46+r()*.12,dx:(r()-.5)*40,dy:(r()-.5)*30}));
})();
const SLAMS=[[4.0,'Tabs.'],[5.0,'Pings.'],[6.0,'Handoffs.'],[7.0,'Spreadsheets.'],[8.0,'Follow-ups.'],[9.0,'Copy.'],[9.5,'Paste.'],[10.0,'Retype.'],[10.5,'Repeat.'],[11.0,'Repeat.'],[11.25,'Repeat.'],[11.5,'Repeat.'],[11.75,'Repeat.']];
function drawCard(ctx,c,alpha){
  font(ctx,24,F.a,500);const tw=ctx.measureText(c.title).width;const w=tw+122,h=82;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=30;ctx.shadowOffsetY=14;
  ctx.fillStyle=B.paper;ctx.fillRect(-w/2,-h/2,w,h);ctx.shadowColor='transparent';
  ctx.strokeStyle=B.rule;ctx.lineWidth=1.5;ctx.strokeRect(-w/2,-h/2,w,h);
  ctx.fillStyle=A(B.forest,.1);ctx.fillRect(-w/2+16,-22,44,44);
  ctx.save();ctx.translate(-w/2+38,0);glyph(ctx,c.icon,26,B.forest,.1);ctx.restore();
  ctx.fillStyle=B.ink;font(ctx,24,F.a,500,false,-.3);ctx.fillText(c.title,-w/2+76,-4);
  font(ctx,13,F.m,500,false,1.5);ctx.fillStyle=B.muted;ctx.fillText(c.sub,-w/2+76,22);
  if(c.badge){const bw=c.badge>9?38:28;rr(ctx,w/2-bw/2-6,-h/2-12,bw,26,13);ctx.fillStyle=B.ember;ctx.fill();
    font(ctx,15,F.m,500);ctx.fillStyle=B.white;ctx.textAlign='center';ctx.fillText(c.badge,w/2-6,-h/2+6);ctx.textAlign='left'}
  ctx.restore();
}
function sChaos(t){
  const inA=inv(3.9,4.3,t);
  const k=E.inExpo(inv(12.0,13.2,t));
  const rot=k*4,jit=inv(8.5,12,t)**2;
  const P=CH_NODES.map((n,i)=>{let x=n.x+Math.sin(t*n.fx+n.p)*n.ax+Math.sin(t*9+i)*jit*10,y=n.y+Math.cos(t*n.fy+n.p)*n.ay+Math.cos(t*8+i*2)*jit*10;
    const ang=Math.atan2(y-CY,x-CX)+rot*(1+i%3*.2),r=Math.hypot(x-CX,y-CY)*(1-k);return[CX+Math.cos(ang)*r,CY+Math.sin(ang)*r]});
  bg.save();bg.globalAlpha=inA*(1-inv(12.9,13.2,t));bg.lineWidth=1.2;
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const d=Math.hypot(P[i][0]-P[j][0],P[i][1]-P[j][1]);if(d>300)continue;
    bg.strokeStyle=A(B.ember,(1-d/300)*.45);bg.beginPath();bg.moveTo(P[i][0],P[i][1]);
    const mx=(P[i][0]+P[j][0])/2+Math.sin(t*3+i)*40,my=(P[i][1]+P[j][1])/2+Math.cos(t*3+j)*40;bg.quadraticCurveTo(mx,my,P[j][0],P[j][1]);bg.stroke()}
  for(const p of P)dot(bg,p[0],p[1],3.2,B.cream,.8);
  bg.restore();
  for(const c of CH_CARDS){
    if(t<c.t0)continue;const a=t-c.t0;const s=clamp(spring(a,1.7,7),0,1.3);
    let x=c.x+c.dx*a*.3+Math.sin(t*23+c.t0*9)*jit*9,y=c.y+c.dy*a*.3+Math.cos(t*19+c.t0*7)*jit*9;

    [0,1,2].forEach(i=>dot(fx,X+26+i*18,Y+26,5,A(B.cream,.45)));font(fx,13,F.m,500,false,2);fx.fillStyle=A(B.cream,.55);fx.fillText('OPERATIONS BOARD',X+94,Y+31);
    fx.fillStyle=A(B.cream,.12);fx.fillRect(X,Y+52,Wd,1);
    const blk=(i,x,y,w,h)=>{const s0=t0+.6+i*.08;const k=E.outQuart(inv(s0,s0+.5,t));if(k<=0)return 0;
      const sx=X+Wd/2+Math.cos(i*2.3)*600,sy=Y+Hd/2+Math.sin(i*1.7)*420;
      const m=E.inOutCubic(inv(.45,1,k)),p=E.outCubic(inv(0,.6,k));
      const cx=lerp(sx,x+w/2,p),cy=lerp(sy,y+h/2,p),ww=lerp(16,w,m),hh=lerp(16,h,m);
      rr(fx,cx-ww/2,cy-hh/2,ww,hh,Math.min(8,hh/2,ww/2)*(1-m));
      fx.fillStyle=m<1?mix(B.cream,B.forest2,m):A(B.cream,.07);fx.fill();fx.strokeStyle=A(B.cream,.2*m);fx.lineWidth=1.2;fx.stroke();
      return inv(.8,1,k)};
    const swap=E.outCubic(inv(32.3,32.6,t));
    const h1=blk(0,X+28,Y+74,Wd-56,60);
    if(h1){fx.save();fx.globalAlpha*=h1;font(fx,36,F.s,400);fx.fillStyle=B.cream;fx.fillText('Job status',X+50,Y+115);
      font(fx,13,F.m,500,false,2);fx.fillStyle=B.sage;fx.textAlign='right';fx.fillText('● LIVE · ONE SOURCE',X+Wd-50,Y+110);fx.restore()}
    const cards=[['IN PRODUCTION','14'],['AWAITING SIGN-OFF',swap>.5?'2':'3'],['SHIPPED THIS WEEK',swap>.5?'23':'22']];
    cards.forEach(([l,v],i)=>{const cw=(Wd-56-28)/3,x=X+28+i*(cw+14),y=Y+150;const k=blk(1+i,x,y,cw,104);
      if(k){fx.save();fx.globalAlpha*=k;font(fx,12,F.m,500,false,1.6);fx.fillStyle=A(B.cream,.6);fx.fillText(l,x+18,y+30);
        font(fx,44,F.a,700,false,-1);fx.fillStyle=i===1&&swap<.5?B.ember:B.cream;fx.fillText(v,x+18,y+84);fx.restore()}});
    const rows=[['#1042','Quote to production','On track'],['#1043','Awaiting sign-off','Sign-off'],['#1044','Materials ordered','On track'],['#1045','Ready to ship','On track'],['#1046','Site visit booked','On track']];
    rows.forEach((r,i)=>{const y=Y+276+i*78;const k=blk(4+i,X+28,y,Wd-56,64);if(!k)return;
      fx.save();fx.globalAlpha*=k;font(fx,16,F.m,500);fx.fillStyle=A(B.cream,.55);fx.fillText(r[0],X+52,y+39);
      font(fx,23,F.a,500);fx.fillStyle=B.cream;fx.fillText(i===1&&swap>.5?'Signed, into production':r[1],X+150,y+40);
      let st=r[2],col=B.sage;if(i===1){st=swap>.5?'On track':'Sign-off';col=swap>.5?B.sage:B.ember}
      font(fx,13,F.m,500,false,1.5);const pw=fx.measureText(st.toUpperCase()).width+38;const px=X+Wd-52-pw;
      fx.strokeStyle=col;fx.lineWidth=1.2;fx.strokeRect(px,y+18,pw,28);dot(fx,px+13,y+32,4,col);fx.fillStyle=col;fx.fillText(st.toUpperCase(),px+24,y+37);
      if(i===1&&t>32.25){const pu=inv(32.3,33.0,t);fx.strokeStyle=A(B.sage,1-pu);fx.lineWidth=2;fx.strokeRect(X+28-pu*8,y-pu*8,Wd-56+pu*16,64+pu*16)}
      fx.restore()});
    fx.restore();
  }
  fx.restore();
}

/* =====================================================================
   06 MARKETING (33.8–38) — three vendors become one system
   ===================================================================== */
function sMarketing(t){
  const W3=[['Demand.',33.85,CY-230],['Brand.',34.35,CY-10],['Measurement.',34.85,CY+210]];
  const col=E.inOutExpo(inv(35.3,35.8,t));
  W3.forEach(([w,t0,y],i)=>{
    if(t<t0)return;const a=t-t0;const sc=(1+.25*Math.exp(-a*12))*(1-col*.85);
    const x=lerp([560,1360,960][i],CX,col),yy=lerp(y,CY,col);
    fx.save();fx.globalAlpha=clamp(a/.05)*(1-col);fx.translate(x,yy);fx.scale(sc,sc);
    font(fx,190,F.s,400,false,-2);fx.textAlign='center';fx.fillStyle=B.cream;fx.fillText(w,0,60);fx.restore();
  });
  if(t>35.4){
    const out=37.7,oa=1-inv(out,out+.3,t);
    for(let k=0;k<36;k++){const s=clamp(spring(t-35.45-k*.012,1.4,7),0,1.25);const a=k/36*6.283+t*.5;const R=250*s;
      dot(fx,CX+Math.cos(a)*R,CY+Math.sin(a)*R,7*Math.min(1,s),B.cream,.9*oa)}
    const sw=E.inOutCubic(inv(35.7,36.8,t));
    if(sw>0){fx.save();fx.globalAlpha=oa;fx.strokeStyle=B.sage;fx.lineWidth=3;fx.lineCap='round';fx.beginPath();fx.arc(CX,CY,300,-Math.PI/2,-Math.PI/2+sw*6.283);fx.stroke();fx.restore()}
    reveal(fx,'One system.',CX,CY+22,{size:78,fam:F.s,fill:B.cream,align:'center',t0:35.65,st:.03,dur:.7,out,t});
    reveal(fx,'PILLAR 03 — 360° DIGITAL MARKETING',110,960,{size:17,fam:F.m,weight:500,ls:2.4,fill:B.sage,t0:35.9,st:.012,dur:.5,out,t});
    reveal(fx,'Demand, brand and measurement handled as one system rather than three vendors.',112,1008,{size:26,fill:A(B.cream,.8),t0:36.1,st:.005,dur:.5,out:out+.03,outSt:.002,t});
  }
}

/* =====================================================================
   07 IMPACT (38–43) — split screen
   ===================================================================== */
function odometer(ctx,str,x,y,{size,t0,t,out,fill,align='left'}){
  font(ctx,size,F.a,700,false,-size*.04);
  const tot=ctx.measureText(str).width;const x0=align==='center'?x-tot/2:x;let cx=x0;
  ctx.save();ctx.beginPath();ctx.rect(x0-20,y-size*.8,tot+40,size*.98);ctx.clip();ctx.fillStyle=fill;
  const q=out!=null?E.inCubic(inv(out,out+.45,t)):0;
  for(let i=0;i<str.length;i++){const ch=str[i],d=parseInt(ch);const w=ctx.measureText(ch).width;
    const rise=(1-E.outQuint(inv(t0+i*.05,t0+i*.05+.7,t)))*size-q*size*1.1;
    if(!isNaN(d)){const p=E.outExpo(inv(t0,t0+1.6,t));const v=d+(1-p)*30;const base=Math.floor(v),f=v-base;
      for(let k=0;k<2;k++)ctx.fillText(String((base+k)%10),cx,y-f*size*1.2+k*size*1.2+rise)}
    else ctx.fillText(ch,cx,y+rise);
    cx+=w}
  ctx.restore();return tot;
}
function sStats(t){
  const inK=E.inOutExpo(inv(37.95,38.45,t)),outK=E.inOutExpo(inv(42.55,43.05,t));
  // left forest panel drops in from the top, leaves upward
  bg.fillStyle=B.cream;bg.fillRect(W-CX*inK,0,CX*inK,H);bg.fillRect(0,H*(1-outK),CX,H*outK);
  // right half is cream already; odometers
  const out=42.4;
  odometer(fx,'9 hrs',CX/2,CY+50,{size:230,t0:38.35,t,out,fill:B.cream,align:'center'});
  odometer(fx,'6 wks',CX+CX/2,CY+50,{size:230,t0:38.65,t,out,fill:B.ember,align:'center'});
  reveal(fx,'returned per person, per week',CX/2,CY+135,{size:32,fill:A(B.cream,.8),align:'center',t0:38.8,st:.01,dur:.6,out,outSt:.004,t});
  reveal(fx,'to first shipped tool',CX+CX/2,CY+135,{size:32,fill:B.slate,align:'center',t0:39.0,st:.01,dur:.6,out,outSt:.004,t});
  reveal(fx,'TIME BACK',CX/2,CY-230,{size:16,fam:F.m,weight:500,ls:2.6,fill:B.sage,align:'center',t0:38.5,st:.03,dur:.5,out,t});
  reveal(fx,'SPEED TO VALUE',CX+CX/2,CY-230,{size:16,fam:F.m,weight:500,ls:2.6,fill:B.ember,align:'center',t0:38.7,st:.03,dur:.5,out,t});
}

/* =====================================================================
   08 VOICE (43–47.4) — what we don't say / what we say
   ===================================================================== */
function sVoice(t){
  reveal(fx,"WE DON'T SAY",CX,CY-170,{size:17,fam:F.m,weight:500,ls:3,fill:B.ember,align:'center',t0:43.1,st:.03,dur:.5,out:44.55,t});
  const s1='We leverage cutting-edge synergies.';
  const w1=measure(fx,s1,{size:92,fam:F.s});
  reveal(fx,s1,CX,CY-20,{size:92,fam:F.s,fill:B.muted,align:'center',t0:43.2,st:.015,dur:.6,out:44.6,outSt:.006,t});
  const strike=E.inOutExpo(inv(43.9,44.3,t))*(1-inv(44.55,44.75,t));
  if(strike>0){fx.fillStyle=B.ember;fx.fillRect(CX-w1/2-20,CY-50,(w1+40)*strike,7)}
  reveal(fx,'WE SAY',CX,CY-170,{size:17,fam:F.m,weight:500,ls:3,fill:B.forest,align:'center',t0:44.8,st:.03,dur:.5,out:47.0,t});
  reveal(fx,"Here's the plan",CX,CY-20,{size:128,fam:F.s,fill:B.ink,align:'center',t0:44.9,st:.03,dur:.8,out:47.0,t});
  runs(fx,[{s:'to get your '},{s:'hours',italic:true,fill:B.ember},{s:' back.'}],CX,CY+120,{size:128,fam:F.s,fill:B.ink,t0:45.4,st:.03,dur:.8,out:47.05,t});
}

/* =====================================================================
   09 ONE LINE (47.35–54) → end card
   ===================================================================== */
const FR=11,FC=22,FS=80;
function sDevice(t){
  const x0=CX-(FC-1)/2*FS,y0=CY-(FR-1)/2*FS,mid=(FR-1)/2;
  const G=lockGeom(fx,104,CX,CY-70);
  const toEnd=E.inOutExpo(inv(53.35,54.25,t));
  const head=t<50.1?-1:lerp(x0+FS+7,x0+(FC-1)*FS+7,E.inOutCubic(inv(50.1,51.0,t)));
  const tw=measure(fx,'One line through the noise.',{size:104,fam:F.s});
  const tm=inv(50.8,51.2,t)*(1-inv(52.7,53.1,t));
  for(let r=0;r<FR;r++)for(let c=0;c<FC;c++){
    const id=r*FC+c;const ap=47.75+hash(id)*.8;if(t<ap)continue;
    const d=Math.abs(r-mid);
    const jt=49.1+d*.07+hash(id+3)*.2,jit=1-E.inOutCubic(inv(jt,jt+.8,t));
    let x=x0+c*FS+jit*(Math.sin(t*2.1+id)*22+Math.sin(t*5.3+id*1.7)*9),y=y0+r*FS+jit*(Math.cos(t*1.8+id*.7)*22+Math.cos(t*4.7+id)*9);
    let rad=7*clamp(spring(t-ap,1.4,7),0,1.2),al=.55*(1-jit*.35*(.5+.5*Math.sin(t*9+id)));
    if(r===mid){if(c===0)al=1;if(c>=1&&head>0)rad*=1-inv(x-14,x+2,head)}
    else al*=1-inv(52.75+hash(id)*.3,53.15+hash(id)*.3,t);
    if(tm>0&&y>CY-265&&y<CY-110&&Math.abs(x-CX)<tw/2+50)al*=1-.88*tm;
    if(r===mid&&c===0){
      const tx=G.mx+(18-50)*G.S,ty=G.my;x=lerp(x,tx,toEnd);y=lerp(y,ty,toEnd);rad=lerp(rad,7*G.S,toEnd);
      dot(fx,x,y,rad,mix(B.cream,B.forest,inv(53.55,53.85,t)),t>59.2?1-inv(59.2,59.9,t):1);continue}
    if(r===mid&&t>53.35)continue;
    dot(fx,x,y,rad,B.cream,al);
  }
  if(head>0){
    let L=x0+FS-7,R=head;const my=lerp(CY,G.my,toEnd),h=lerp(14,14*G.S,toEnd);
    L=lerp(L,G.mx+(37-50)*G.S,toEnd);R=lerp(R,G.mx+(84-50)*G.S,toEnd);
    pill(fx,L,R,my,h,B.ember,1-inv(59.2,59.9,t));
  }
  reveal(fx,'One line through the noise.',CX,CY-150,{size:104,fam:F.s,fill:B.cream,align:'center',t0:50.85,st:.03,dur:.9,out:52.7,t});
  if(t>=53.35)sEnd(t,G);
}
function sEnd(t,G){
  const fade=1-inv(59.2,59.9,t);
  const sc=MK_DOTS.map((_,i)=>clamp(spring(t-(53.95+[0,1,2,0,4,5,6][i]*.05),1.5,7),0,1.25));sc[3]=0;
  fx.save();fx.globalAlpha=fade;
  drawMark(fx,G.mx,G.my,G.S,{sc,barR:0});
  reveal(fx,'CONSULTING · AUTOMATION · PRODUCT · MARKETING',CX,CY-275,{size:17,fam:F.m,weight:500,ls:2.6,fill:B.ember,align:'center',t0:54.6,st:.012,dur:.5,t});
  drawLockText(fx,G,54.2,{t});
  reveal(fx,'Fewer moving parts.',CX,CY+120,{size:72,fam:F.s,fill:B.ink,align:'center',t0:55.0,st:.035,dur:.9,t});
  const k=E.outExpo(inv(55.7,56.4,t));
  if(k>0){const label='Book a 30-min audit';font(fx,26,F.a,600,false,-.2);const lw=fx.measureText(label).width;const w=lw+80,h=66,x=CX-w/2,y=CY+188;
    fx.fillStyle=B.forest;fx.fillRect(x,y,w*k,h);
    fx.save();fx.beginPath();fx.rect(x,y,w*k,h);fx.clip();fx.fillStyle=B.cream;fx.fillText(label,x+40,y+42);fx.restore()}
  reveal(fx,COPY.url,CX,CY+330,{size:19,fam:F.m,ls:1,fill:B.muted,align:'center',t0:56.3,st:.01,dur:.5,t});
  fx.restore();
}

/* =====================================================================
   POST
   ===================================================================== */
const FLASHES=[[13.2,1,B.cream,5],[16.0,.6,B.white,5],[36.0,0,B.white,1]];
const CHAPTERS=[[0,'00 — Prologue'],[4,'01 — Friction'],[13.2,'02 — The truth'],[16,''],[21.5,'03 — Automation'],[29.2,'04 — Product'],[33.8,'05 — Marketing'],[38,'06 — Impact'],[43,'07 — Voice'],[47.6,'08 — One line'],[53.4,'']];
function post(t){
  fx.setTransform(1,0,0,1,0,0);bg.setTransform(1,0,0,1,0,0);
  let gi=inv(10.8,12.0,t)*(1-inv(12.0,12.3,t));
  for(const[s]of SLAMS){const a=t-s;if(a>=0&&a<.08&&s>=4)gi=Math.max(gi,.6)}
  if(t>3.4&&t<4.05)gi=Math.max(gi,inv(3.4,4,t)*.7);
  if(gi>0){for(let i=0;i<Math.round(3+gi*9);i++){const y=hash(FI*13+i)*H,h=8+hash(FI*7+i)*70,dx=(hash(FI*3+i*5)-.5)*180*gi;fx.drawImage(bgC,0,y,W,h,dx,y,W,h)}
    fx.fillStyle=A(B.ember,.08*gi);fx.fillRect(0,hash(FI)*H,W,4+hash(FI+1)*30)}
  for(const[t0,amp,col,dec]of FLASHES){const a=t-t0;if(a<0||a>1.5||amp<=0)continue;fx.fillStyle=A(col,amp*Math.exp(-a*dec));fx.fillRect(0,0,W,H)}
  let ch=CHAPTERS[0];for(const c of CHAPTERS)if(t>=c[0])ch=c;
  const ha=inv(.8,1.4,t)*(ch[1]?1:0);
  if(ha>0){const f=onForest(t)&&!(t>=38&&t<43);const col=f?B.sage:B.muted;
    fx.save();fx.globalAlpha=ha*.85;font(fx,13,F.m,500,false,1.8);fx.fillStyle=col;
    fx.fillText(ch[1].toUpperCase(),72,74);fx.textAlign='right';fx.fillStyle=t>=38&&t<43?B.muted:col;fx.fillText('STREAMLINE WORKFLOWS',W-72,74);
    fx.restore()}
  if(t<13.2){const v=fx.createRadialGradient(CX,CY,H*.35,CX,CY,H*1.05);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');fx.fillStyle=v;fx.fillRect(0,0,W,H)}
  fx.globalAlpha=.04;fx.fillStyle=fx.createPattern(GRAIN[FI%6],'repeat');fx.fillRect(0,0,W,H);fx.globalAlpha=1;
  const bi=1-inv(0,.25,t);if(bi>0){fx.fillStyle=A('#000000',bi);fx.fillRect(0,0,W,H)}
  const bo=E.inCubic(inv(59.5,60,t));if(bo>0){fx.fillStyle=A(B.cream,bo);fx.fillRect(0,0,W,H)}
}

function render(t){
  T=t;FI=Math.round(t*60);
  fx.setTransform(1,0,0,1,0,0);fx.globalAlpha=1;fx.clearRect(0,0,W,H);
  drawBG(t);
  let sh=0;if(t>4&&t<12.2){sh=2+12*inv(8.5,12,t)**2;for(const[s]of SLAMS){const a=t-s;if(a>=0&&a<.4)sh+=10*Math.exp(-a*14)}}
  const sx=(hash(FI*1.3)-.5)*sh,sy=(hash(FI*2.7)-.5)*sh;
  bg.setTransform(1,0,0,1,sx,sy);fx.setTransform(1,0,0,1,sx,sy);
  if(t<4.2)sPrologue(t);
  if(t>=3.9&&t<13.3)sChaos(t);
  bg.setTransform(1,0,0,1,0,0);fx.setTransform(1,0,0,1,0,0);
  if(t>=13.2&&t<16.1)sTruth(t);
  if(t>=15.99&&t<21.5)sLogo(t);
  sBuild(t);
  if(t>=29.2&&t<33.8)sProduct(t);
  if(t>=33.8&&t<38.1)sMarketing(t);
  if(t>=37.9&&t<43.1)sStats(t);
  if(t>=43&&t<47.4)sVoice(t);
  if(t>=47.3)sDevice(t);
  post(t);
}
window.render=render;
window.ready=Promise.all([`700 20px ${F.a}`,`600 20px ${F.a}`,`500 20px ${F.a}`,`400 20px ${F.a}`,`400 20px ${F.s}`,`italic 400 20px ${F.s}`,`400 20px ${F.m}`,`500 20px ${F.m}`].map(f=>document.fonts.load(f))).then(()=>document.fonts.ready);
const q=new URLSearchParams(location.search);
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);document.getElementById('root').style.transform=`scale(${s})`}
if(!q.has('render')){addEventListener('resize',fit);fit();
  window.ready.then(()=>{if(q.has('t')){render(parseFloat(q.get('t')));return}const st=performance.now();const loop=()=>{render(((performance.now()-st)/1000)%DURATION);requestAnimationFrame(loop)};loop()})}
</script>
