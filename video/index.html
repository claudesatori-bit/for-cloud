<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Streamline Motion Film</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html,body{margin:0;background:#06070B;overflow:hidden}
  #root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#06070B;transform-origin:0 0}
  #root canvas{position:absolute;left:0;top:0}
  #stageWrap{position:absolute;inset:0;perspective:1900px;perspective-origin:50% 46%;pointer-events:none}
  #ui{left:50% !important;top:50% !important;width:1600px;height:900px;border-radius:28px;display:none;
      box-shadow:0 90px 220px rgba(123,108,255,.30),0 0 0 1px rgba(255,255,255,.05);transform-origin:50% 50%}
</style>
</head>
<body>
<div id="root">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="stageWrap"><canvas id="ui" width="2400" height="1350"></canvas></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
</div>
<script>
/* =====================================================================
   STREAMLINE — a 60s motion film. Every frame is a pure function of t.
   ===================================================================== */
const W=1920,H=1080,CX=960,CY=540,DURATION=60;
const bgC=document.getElementById('bg'),fxC=document.getElementById('fx'),uiC=document.getElementById('ui');
const bg=bgC.getContext('2d'),fx=fxC.getContext('2d'),ui=uiC.getContext('2d');
const UIS=1.5; // ui canvas supersampling

const COPY={
  brand:'Streamline',
  url:'streamline-workflows-site.vercel.app',
  prompt:'every team runs on workflows.',
};
const C={bg:'#06070B',ink:'#F3F5FA',soft:'#AEB6C8',muted:'#7D869A',dim:'#2A3142',
  indigo:'#7B6CFF',violet:'#9D8CFF',cyan:'#2EE6D6',lime:'#D4FF4F',coral:'#FF5A5F',amber:'#FFB547',
  panel:'#0B0E15',card:'#121722'};
const F={d:'"Space Grotesk"',s:'"Instrument Serif"',m:'"JetBrains Mono"'};

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,k)=>a+(b-a)*k;
const inv=(a,b,x)=>clamp((x-a)/(b-a));
const frac=x=>x-Math.floor(x);
const E={
  lin:x=>x,
  inCubic:x=>x*x*x, outCubic:x=>1-(1-x)**3, inOutCubic:x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2,
  outQuint:x=>1-(1-x)**5, inQuint:x=>x**5,
  outExpo:x=>x>=1?1:1-2**(-10*x), inExpo:x=>x<=0?0:2**(10*x-10),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?2**(20*x-10)/2:(2-2**(-20*x+10))/2,
  outBack:x=>{const c1=1.6,c3=c1+1;return 1+c3*(x-1)**3+c1*(x-1)**2},
  inOutSine:x=>-(Math.cos(Math.PI*x)-1)/2,
};
const spring=(a,f=1.8,d=6.5)=>a<=0?0:1-Math.exp(-d*a)*Math.cos(f*Math.PI*2*a);
const hash=n=>frac(Math.sin(n*127.1+311.7)*43758.5453);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function A(h,a){const[r,g,b]=rgb(h);return`rgba(${r},${g},${b},${a})`}
function mix(h1,h2,k,a=1){const p=rgb(h1),q=rgb(h2);return`rgba(${p.map((v,i)=>Math.round(lerp(v,q[i],k))).join(',')},${a})`}

/* ---------- text ---------- */
function font(ctx,size,fam=F.d,weight=700,italic=false,ls=0){ctx.font=`${italic?'italic ':''}${weight} ${size}px ${fam}`;ctx.letterSpacing=ls+'px'}
function grad(c1,c2){return(ctx,x0,w,y,s)=>{const g=ctx.createLinearGradient(x0,y-s,x0+w,y);g.addColorStop(0,c1);g.addColorStop(1,c2);return g}}
function measure(ctx,str,o){font(ctx,o.size,o.fam||F.d,o.weight??700,o.italic,o.ls||0);return ctx.measureText(str).width}
/* per-letter masked reveal */
function reveal(ctx,str,x,y,o){
  const{size=100,fam=F.d,weight=700,italic=false,ls=0,fill=C.ink,align='left',t0=0,st=.035,dur=.8,rise=1.05,
    ez=E.outQuint,out=null,outDur=.45,outSt=.018,clip=true,alpha=1,t=T,blur=false}=o;
  font(ctx,size,fam,weight,italic,ls);
  const w=ctx.measureText(str).width;
  const x0=align==='center'?x-w/2:align==='right'?x-w:x;
  ctx.save();
  if(clip){ctx.beginPath();ctx.rect(x0-size,y-size*1.08,w+size*2,size*1.45);ctx.clip()}
  ctx.fillStyle=typeof fill==='function'?fill(ctx,x0,w,y,size):fill;
  ctx.textBaseline='alphabetic';ctx.textAlign='left';
  for(let i=0;i<str.length;i++){
    const ch=str[i];if(ch===' ')continue;
    const xi=x0+ctx.measureText(str.slice(0,i)).width;
    const p=ez(inv(t0+i*st,t0+i*st+dur,t));
    let dy=(1-p)*size*rise,a=clamp(p*1.4);
    if(out!=null){const q=E.inCubic(inv(out+i*outSt,out+i*outSt+outDur,t));dy-=q*size*rise;a*=1-q}
    if(a<=.002)continue;
    ctx.globalAlpha=a*alpha;
    ctx.fillText(ch,xi,y+dy);
  }
  ctx.restore();return w;
}

/* ---------- shapes ---------- */
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function glyph(ctx,kind,s,col,lw=.085){
  ctx.save();ctx.scale(s,s);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
  const P=(pts,close=true,fill=false)=>{ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(close)ctx.closePath();fill?ctx.fill():ctx.stroke()};
  switch(kind){
    case'bolt':P([[.08,-.46],[-.26,.06],[-.01,.06],[-.1,.46],[.27,-.09],[.02,-.09]],true,true);break;
    case'spark':{ctx.beginPath();for(let k=0;k<8;k++){const r=k%2?.12:.44,a=k*Math.PI/4-Math.PI/2;k?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.arc(.3,-.3,.06,0,7);ctx.fill();break}
    case'cond':P([[0,-.4],[.4,0],[0,.4],[-.4,0]]);ctx.beginPath();ctx.arc(0,0,.08,0,7);ctx.fill();break;
    case'send':P([[-.36,0],[.3,0]],false);P([[.08,-.22],[.32,0],[.08,.22]],false);break;
    case'mail':rr(ctx,-.4,-.28,.8,.56,.08);ctx.stroke();P([[-.36,-.22],[0,.04],[.36,-.22]],false);break;
    case'chat':rr(ctx,-.4,-.32,.8,.52,.14);ctx.stroke();P([[-.18,.2],[-.26,.38],[.0,.2]],false);for(let k=-1;k<=1;k++){ctx.beginPath();ctx.arc(k*.16,-.06,.05,0,7);ctx.fill()}break;
    case'doc':P([[-.3,-.42],[.12,-.42],[.3,-.24],[.3,.42],[-.3,.42]]);P([[-.14,-.06],[.16,-.06]],false);P([[-.14,.1],[.16,.1]],false);P([[-.14,.26],[.06,.26]],false);break;
    case'cal':rr(ctx,-.38,-.32,.76,.7,.08);ctx.stroke();P([[-.38,-.12],[.38,-.12]],false);P([[-.18,-.44],[-.18,-.24]],false);P([[.18,-.44],[.18,-.24]],false);
      for(let i=0;i<3;i++)for(let j=0;j<2;j++){ctx.beginPath();ctx.arc(-.2+i*.2,.04+j*.17,.045,0,7);ctx.fill()}break;
    case'db':ctx.beginPath();ctx.ellipse(0,-.28,.34,.12,0,0,7);ctx.stroke();P([[-.34,-.28],[-.34,.28]],false);P([[.34,-.28],[.34,.28]],false);
      ctx.beginPath();ctx.ellipse(0,.28,.34,.12,0,0,Math.PI);ctx.stroke();ctx.beginPath();ctx.ellipse(0,0,.34,.12,0,0,Math.PI);ctx.stroke();break;
    case'card':rr(ctx,-.42,-.28,.84,.56,.08);ctx.stroke();ctx.fillRect(-.42,-.16,.84,.1);ctx.fillRect(-.3,.1,.2,.06);break;
    case'cloud':ctx.beginPath();ctx.moveTo(-.3,.22);ctx.arc(-.22,.06,.16,Math.PI*.5,Math.PI*1.4);ctx.arc(.0,-.08,.24,Math.PI*1.1,Math.PI*1.95);ctx.arc(.24,.08,.14,-Math.PI*.4,Math.PI*.5);ctx.closePath();ctx.stroke();break;
    case'chart':for(let k=0;k<3;k++){const hh=[.3,.52,.74][k];rr(ctx,-.34+k*.26,.38-hh,.16,hh,.03);ctx.fill()}break;
    case'bell':ctx.beginPath();ctx.moveTo(-.3,.22);ctx.quadraticCurveTo(-.24,.12,-.24,-.04);ctx.arc(0,-.04,.24,Math.PI,0);ctx.quadraticCurveTo(.24,.12,.3,.22);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.arc(0,.32,.07,0,7);ctx.fill();break;
    case'user':ctx.beginPath();ctx.arc(0,-.14,.16,0,7);ctx.stroke();ctx.beginPath();ctx.arc(0,.44,.32,Math.PI*1.1,Math.PI*1.9);ctx.stroke();break;
    case'code':P([[-.14,-.26],[-.38,0],[-.14,.26]],false);P([[.14,-.26],[.38,0],[.14,.26]],false);P([[.07,-.34],[-.07,.34]],false);break;
    case'grid':rr(ctx,-.38,-.34,.76,.68,.06);ctx.stroke();P([[-.38,-.1],[.38,-.1]],false);P([[-.38,.12],[.38,.12]],false);P([[-.12,-.34],[-.12,.34]],false);P([[.12,-.34],[.12,.34]],false);break;
    case'check':P([[-.3,0],[-.08,.22],[.32,-.2]],false);break;
    case'clock':ctx.beginPath();ctx.arc(0,0,.36,0,7);ctx.stroke();P([[0,-.2],[0,0],[.16,.1]],false);break;
  }
  ctx.restore();
}
function cursor(ctx,x,y,s=1,a=1){
  ctx.save();ctx.translate(x,y);ctx.scale(1.35*s,1.35*s);ctx.globalAlpha=a;
  ctx.beginPath();[[0,0],[0,26],[7,20],[12,31],[16,29],[11,18.5],[20,18.5]].forEach(([px,py],i)=>i?ctx.lineTo(px,py):ctx.moveTo(px,py));ctx.closePath();
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=10;ctx.shadowOffsetY=4;ctx.fillStyle='#fff';ctx.fill();ctx.shadowColor='transparent';
  ctx.lineWidth=1.4;ctx.strokeStyle='#0A0C10';ctx.stroke();ctx.restore();
}

/* ---------- the Streamline mark: an S-flow between two nodes ---------- */
const SWEEP1=1.5*Math.PI-.2,SWEEP2=1.5*Math.PI+.2,SWEEP=SWEEP1+SWEEP2;
function sPt(s){const r=.25,d=s*SWEEP;
  if(d<SWEEP1){const a=-.2-d;return[r*Math.cos(a),-.25+r*Math.sin(a)]}
  const a=-Math.PI/2+(d-SWEEP1);return[r*Math.cos(a),.25+r*Math.sin(a)]}
function drawMark(ctx,x,y,u,{prog=1,t=T,alpha=1,flow=true,nodeT=-9,endT=-9,glow=1}={}){
  ctx.save();ctx.translate(x,y);ctx.globalAlpha=alpha;
  const g=ctx.createLinearGradient(u*.3,-u*.5,-u*.3,u*.5);g.addColorStop(0,C.violet);g.addColorStop(.5,C.indigo);g.addColorStop(1,C.cyan);
  if(prog>0){
    ctx.beginPath();const N=90,n=Math.max(2,Math.round(N*prog));
    for(let i=0;i<=n;i++){const[px,py]=sPt(i/n*prog);i?ctx.lineTo(px*u,py*u):ctx.moveTo(px*u,py*u)}
    ctx.lineCap='round';ctx.lineJoin='round';
    if(glow){ctx.shadowColor=A(C.indigo,.8*glow);ctx.shadowBlur=u*.25}
    ctx.strokeStyle=g;ctx.lineWidth=u*.14;ctx.stroke();ctx.shadowBlur=0;
    // inner highlight
    ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=u*.035;ctx.stroke();
  }
  if(flow&&prog>=1){
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<14;i++){const s=frac(i/14+t*.32);const[px,py]=sPt(s);const r=u*.022*(1-Math.abs(s-.5)*.8);
      ctx.fillStyle=`rgba(255,255,255,${.75*alpha})`;ctx.beginPath();ctx.arc(px*u,py*u,r,0,7);ctx.fill()}
    ctx.globalCompositeOperation='source-over';
  }
  // start node (lime), end node (ring)
  const ns=clamp(spring(t-nodeT,1.6,7),0,1.3);
  if(ns>0){const[px,py]=sPt(0);ctx.fillStyle=C.lime;ctx.shadowColor=A(C.lime,.7);ctx.shadowBlur=u*.2*glow;
    ctx.beginPath();ctx.arc(px*u,py*u,u*.09*ns,0,7);ctx.fill();ctx.shadowBlur=0}
  const es=clamp(spring(t-endT,1.6,7),0,1.3);
  if(es>0){const[px,py]=sPt(1);ctx.strokeStyle=C.cyan;ctx.lineWidth=u*.045;ctx.fillStyle=C.bg;
    ctx.beginPath();ctx.arc(px*u,py*u,u*.075*es,0,7);ctx.fill();ctx.stroke()}
  ctx.restore();
}
function lockup(ctx,cx,cy,{t0,size=170,alpha=1,t=T,out=null}){
  // returns geometry; draws mark (animated) and wordmark reveal
  const u=size*1.18;
  const tw=measure(ctx,COPY.brand,{size,ls:-size*.04});
  const mw=u*.62,gap=size*.28,total=mw+gap+tw,left=cx-total/2;
  const k=E.outExpo(inv(t0+.95,t0+1.75,t));
  const bigU=size*2;
  const mx=lerp(cx,left+mw/2,k),mu=lerp(bigU,u,k),my=lerp(cy,cy-size*.02,k);
  const prog=E.inOutCubic(inv(t0,t0+.9,t));
  let oa=alpha;if(out!=null)oa*=1-E.inCubic(inv(out,out+.5,t));
  drawMark(ctx,mx,my,mu,{prog,t,alpha:oa,nodeT:t0,endT:t0+.88});
  reveal(ctx,COPY.brand,left+mw+gap,cy+size*.36,{size,ls:-size*.04,t0:t0+1.1,st:.04,dur:.9,t,alpha:oa,out:out!=null?out:null});
  return{mx,my,mu,left,total};
}

/* ---------- ambient flow field (the film's motif) ---------- */
function streamField(ctx,t,{alpha=1,R=0,cx=CX,cy=CY,n=46,sx=.42,speed=1,amp=1}){
  if(alpha<=0)return;
  ctx.save();
  for(let i=0;i<n;i++){
    const y0=((i+.5)/n-.5)*H*1.25;
    const near=Math.exp(-(y0*y0)/(2*260*260));
    ctx.beginPath();
    for(let x=-40;x<=W+40;x+=14){
      const wave=(Math.sin(x*.0042+t*.8+i*.45)*16+Math.sin(x*.0016-t*.45+i*1.3)*26)*amp;
      let y=y0+wave;const dx=(x-cx)*sx;
      if(R>0){const r2=dx*dx+y*y;y+=R*R*y/(r2+R*R*.32)}
      x===-40?ctx.moveTo(x,cy+y):ctx.lineTo(x,cy+y);
    }
    const g=ctx.createLinearGradient(0,0,W,0);
    g.addColorStop(0,A(C.indigo,0));g.addColorStop(.3,A(C.indigo,1));g.addColorStop(.7,A(C.cyan,1));g.addColorStop(1,A(C.cyan,0));
    ctx.strokeStyle=g;ctx.lineWidth=1.2;ctx.globalAlpha=alpha*(.10+.16*near);ctx.setLineDash([]);ctx.stroke();
    ctx.lineWidth=2.4;ctx.globalAlpha=alpha*(.35+.5*near);ctx.setLineDash([2,26+(i%4)*9]);ctx.lineDashOffset=-(t*150*speed+i*37);ctx.stroke();
  }
  ctx.setLineDash([]);ctx.restore();
}

/* ---------- grain ---------- */
const GRAIN=[...Array(6)].map((_,k)=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const d=g.createImageData(256,256);const r=rng(99+k);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return c});

let T=0,FI=0;

/* =====================================================================
   BACKGROUND
   ===================================================================== */
function drawBG(t){
  bg.setTransform(1,0,0,1,0,0);bg.globalAlpha=1;bg.globalCompositeOperation='source-over';
  bg.fillStyle=C.bg;bg.fillRect(0,0,W,H);
  // scene-tinted glow
  const chaos=inv(3.6,4.2,t)*(1-inv(12.4,13.2,t));
  const blobs=[
    {x:CX+Math.sin(t*.3)*240,y:CY-160+Math.cos(t*.23)*80,r:900,c:chaos>.01?mix(C.indigo,C.coral,chaos):C.indigo,a:.16+.06*chaos},
    {x:CX+420+Math.cos(t*.2)*200,y:CY+260,r:800,c:C.cyan,a:.07*(1-chaos)},
  ];
  for(const b of blobs){const g=bg.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    g.addColorStop(0,b.c.startsWith('#')?A(b.c,b.a):b.c.replace(/[\d.]+\)$/,b.a+')'));g.addColorStop(1,'rgba(0,0,0,0)');bg.fillStyle=g;bg.fillRect(0,0,W,H)}
  // dot grid
  const off=(t*10)%48;
  bg.fillStyle=chaos>.5?'rgba(255,120,120,.07)':'rgba(170,180,210,.075)';
  for(let x=-48+off;x<W+48;x+=48)for(let y=-48+off*.5;y<H+48;y+=48)bg.fillRect(x,y,2,2);
}

/* =====================================================================
   00 PROLOGUE  (0 – 4s)
   ===================================================================== */
function sPrologue(t){
  const k3=inv(3.0,4.0,t),fade=1-inv(3.85,4.15,t);
  const L=E.inOutCubic(inv(1.9,3.0,t))*1150;
  bg.save();bg.globalAlpha=fade;
  if(L>1){
    for(let j=0;j<7;j++){
      if(j>0&&k3<=0)break;
      bg.beginPath();
      for(let x=-L;x<=L;x+=8){
        const env=Math.sin(Math.PI*(x+L)/(2*L));
        const calm=Math.sin(x*.008-t*4)*22*env;
        const ch=k3*k3*(Math.sin(x*.021*(1+j*.35)+t*(9+j)+j*2)*110+Math.sin(x*.063+j*5-t*14)*46)*env*(j===0?.5:1);
        const y=CY+calm+ch*(1+j*.12);
        x===-L?bg.moveTo(CX+x,y):bg.lineTo(CX+x,y);
      }
      const g=bg.createLinearGradient(CX-L,0,CX+L,0);
      if(j===0){g.addColorStop(0,mix(C.indigo,C.coral,k3));g.addColorStop(1,mix(C.cyan,C.coral,k3*.6))}
      else{g.addColorStop(0,A(C.coral,.9));g.addColorStop(1,A(C.amber,.6))}
      bg.strokeStyle=g;bg.lineWidth=j===0?3:1.6;bg.globalAlpha=fade*(j===0?1:k3*.85);
      bg.shadowColor=j===0?A(C.indigo,.9):'transparent';bg.shadowBlur=j===0?18:0;bg.stroke();bg.shadowBlur=0;
    }
  }
  bg.globalAlpha=fade;
  // beat pulses
  for(let b=.5;b<4;b+=.5){const a=t-b;if(a>0&&a<.9){bg.strokeStyle=A(C.cyan,(1-a/.9)*.45);bg.lineWidth=1.5;bg.beginPath();bg.arc(CX,CY,8+E.outCubic(a/.9)*110,0,7);bg.stroke()}}
  const dr=8*clamp(spring(t-.2,1.4,6),0,1.4);
  const jx=k3*(hash(FI)-.5)*18,jy=k3*(hash(FI+7)-.5)*18;
  if(dr>0){bg.fillStyle='#fff';bg.shadowColor=C.cyan;bg.shadowBlur=24;bg.beginPath();bg.arc(CX+jx,CY+jy,dr,0,7);bg.fill();bg.shadowBlur=0}
  bg.restore();

  // typed prompt
  const s=COPY.prompt,n=Math.floor(inv(.6,1.85,t)*s.length);
  if(t>.45){
    font(fx,34,F.m,400,false,0);
    const full=fx.measureText('›  '+s).width,x0=CX-full/2,y=CY-110;
    const shown='›  '+s.slice(0,n);
    const draw=(dx,col)=>{fx.fillStyle=col;fx.fillText(shown,x0+dx,y)};
    fx.save();fx.globalAlpha=fade*clamp((t-.45)/.2);
    if(k3>0){fx.globalCompositeOperation='lighter';draw(k3*22*(hash(FI*3)-.2),A(C.coral,.8));draw(-k3*22*hash(FI*5),A(C.cyan,.8));fx.globalCompositeOperation='source-over'}
    draw(0,'#B7BFD0');
    fx.fillStyle=C.cyan;fx.fillText('›',x0,y);
    if(n<s.length||Math.floor(t*2.2)%2===0){const cw=fx.measureText(shown).width;fx.fillStyle=C.cyan;fx.fillRect(x0+cw+6,y-28,16,34)}
    fx.restore();
  }
}

/* =====================================================================
   01 CHAOS  (4 – 13.2s)
   ===================================================================== */
const CH_NODES=(()=>{const r=rng(7);return[...Array(46)].map(()=>({x:r()*W,y:r()*H,ax:30+r()*90,ay:30+r()*90,fx:.3+r()*1.1,fy:.3+r()*1.1,p:r()*6.28}))})();
const CH_CARDS=(()=>{
  const list=[
    ['Re: Re: Fwd: Q3 plan (final_v7)','MAIL · 2m ago',C.coral,'mail',3],
    ['@you where is the latest file?','CHAT · now',C.amber,'chat',12],
    ['Status update due — again','REMINDER · 9:00',C.indigo,'bell',0],
    ['Meeting moved to 4:30','CALENDAR · 1m',C.cyan,'cal',0],
    ['Approval pending · 3 days','APPROVALS',C.coral,'doc',5],
    ['Copy row 48 into the CRM','TODO · overdue',C.amber,'grid',0],
    ['Who owns this task?','CHAT · #ops',C.indigo,'chat',27],
    ['Invoice #2291 needs sign-off','FINANCE',C.coral,'card',2],
    ['Handoff missed: onboarding','ALERT',C.coral,'bell',1],
    ['Update the tracker (again)','TODO',C.amber,'grid',0],

  if(t>=54.95){
    // end card
    const vg=fx.createRadialGradient(CX,CY-40,0,CX,CY-40,520);vg.addColorStop(0,'rgba(6,7,11,.85)');vg.addColorStop(1,'rgba(6,7,11,0)');fx.fillStyle=vg;fx.fillRect(0,0,W,H);
    lockup(fx,CX,CY-60,{t0:55.0,size:150,t});
    const ct=56.25,cs=clamp(spring(t-ct,1.4,6),0,1.2);
    if(cs>0){
      const label='Start automating free';font(fx,30,F.d,700,false,-.5);const lw=fx.measureText(label).width;const w=lw+120,h=78,y=CY+140;
      fx.save();fx.translate(CX,y);fx.scale(cs,cs);
      rr(fx,-w/2,-h/2,w,h,h/2);fx.fillStyle=C.lime;fx.shadowColor=A(C.lime,.45);fx.shadowBlur=50;fx.fill();fx.shadowBlur=0;
      fx.save();fx.clip();for(const st of[57.1,58.5]){const k=inv(st,st+.8,t);if(k>0&&k<1){const sx=lerp(-w,w,E.inOutCubic(k));const g=fx.createLinearGradient(sx-80,0,sx+80,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.75)');g.addColorStop(1,'rgba(255,255,255,0)');fx.fillStyle=g;fx.fillRect(-w/2,-h/2,w,h)}}fx.restore();
      fx.fillStyle='#0A0C10';fx.textAlign='left';fx.fillText(label,-w/2+44,11);
      const ax=-w/2+44+lw+18+Math.sin(Math.max(0,t-56.8)*5)*3*(t>56.8?1:0);fx.strokeStyle='#0A0C10';fx.lineWidth=3.5;fx.lineCap='round';fx.lineJoin='round';
      fx.beginPath();fx.moveTo(ax,0);fx.lineTo(ax+26,0);fx.moveTo(ax+16,-10);fx.lineTo(ax+26,0);fx.lineTo(ax+16,10);fx.stroke();
      fx.restore();
    }
    reveal(fx,COPY.url,CX,CY+250,{size:22,fam:F.m,weight:400,ls:1,fill:C.muted,align:'center',t0:56.7,st:.012,dur:.5,t});
  }
}

/* =====================================================================
   POST
   ===================================================================== */
const FLASHES=[[13.2,1,'#ffffff',5],[16.0,.9,'#ffffff',3.8],[22.0,1,C.lime,6],[36.0,.22,'#ffffff',7],[44.0,.18,'#ffffff',7],[52.0,.85,'#ffffff',4.5],[55.0,.45,'#ffffff',5]];
const CHAPTERS=[[0,'00','PROLOGUE'],[4,'01','FRICTION'],[13.2,'02','SHIFT'],[16,'03','IDENTITY'],[22,'04','BUILD'],[36,'05','IMPACT'],[44,'06','CONNECT'],[52,'07','MOMENTUM']];
function post(t){
  fx.setTransform(1,0,0,1,0,0);bg.setTransform(1,0,0,1,0,0);
  // glitch slices during friction peaks
  let gi=inv(10.8,12.0,t)*(1-inv(12.0,12.3,t));
  for(const[s]of SLAMS){const a=t-s;if(a>=0&&a<.08&&s>=4)gi=Math.max(gi,.6)}
  if(t>3.4&&t<4.05)gi=Math.max(gi,inv(3.4,4,t)*.7);
  if(gi>0){for(let i=0;i<Math.round(3+gi*9);i++){const y=hash(FI*13+i)*H,h=8+hash(FI*7+i)*70,dx=(hash(FI*3+i*5)-.5)*180*gi;
    fx.drawImage(bgC,0,y,W,h,dx,y,W,h);}
    fx.globalCompositeOperation='lighter';fx.fillStyle=A(C.coral,.06*gi);fx.fillRect(0,hash(FI)*H,W,4+hash(FI+1)*30);fx.globalCompositeOperation='source-over'}
  // flashes
  for(const[t0,amp,col,dec]of FLASHES){const a=t-t0;if(a<0||a>1.5)continue;fx.fillStyle=A(col,amp*Math.exp(-a*dec));fx.fillRect(0,0,W,H)}
  // HUD
  const ha=inv(.8,1.4,t)*(1-inv(54.6,55,t));
  if(ha>0){let ch=CHAPTERS[0];for(const c of CHAPTERS)if(t>=c[0])ch=c;
    fx.save();fx.globalAlpha=ha*.55;font(fx,13,F.m,400,false,3);fx.fillStyle=C.soft;
    fx.fillText('STREAMLINE',64,58);fx.textAlign='right';fx.fillText(`${ch[1]} — ${ch[2]}`,W-64,58);
    fx.textAlign='left';fx.fillText('WORKFLOWS THAT RUN THEMSELVES',64,H-44);
    fx.textAlign='right';const tc=Math.min(59.99,t);fx.fillText(`00:${String(Math.floor(tc)).padStart(2,'0')}:${String(Math.floor(frac(tc)*60)).padStart(2,'0')}`,W-64,H-44);
    fx.strokeStyle=C.soft;fx.lineWidth=1.2;const m=30,l=16;[[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{fx.beginPath();fx.moveTo(x,y+sy*l);fx.lineTo(x,y);fx.lineTo(x+sx*l,y);fx.stroke()});
    fx.restore()}
  // vignette
  const v=fx.createRadialGradient(CX,CY,H*.35,CX,CY,H*1.05);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');fx.fillStyle=v;fx.fillRect(0,0,W,H);
  // grain
  fx.globalAlpha=.045;fx.fillStyle=fx.createPattern(GRAIN[FI%6],'repeat');fx.fillRect(0,0,W,H);fx.globalAlpha=1;
  // fade in / out
  const blk=Math.max(1-inv(0,.25,t),E.inCubic(inv(59.1,60,t)));if(blk>0){fx.fillStyle=`rgba(0,0,0,${blk})`;fx.fillRect(0,0,W,H)}
}

/* =====================================================================
   RENDER
   ===================================================================== */
function render(t){
  T=t;FI=Math.round(t*60);
  fx.setTransform(1,0,0,1,0,0);fx.globalAlpha=1;fx.globalCompositeOperation='source-over';fx.clearRect(0,0,W,H);
  drawBG(t);
  // camera shake during friction
  let sh=0;if(t>4&&t<12.2){sh=2+12*inv(8.5,12,t)**2;for(const[s]of SLAMS){const a=t-s;if(a>=0&&a<.4)sh+=10*Math.exp(-a*14)}}
  const sx=(hash(FI*1.3)-.5)*sh,sy=(hash(FI*2.7)-.5)*sh;
  bg.setTransform(1,0,0,1,sx,sy);fx.setTransform(1,0,0,1,sx,sy);
  if(t<4.2)sPrologue(t);
  if(t>=3.9&&t<13.3)sChaos(t);
  if(t>=13.1&&t<16.05)sShift(t);
  if(t>=15.99&&t<22.05)sLogo(t);
  sBuild(t);
  if(t>=35.9&&t<44.4)sStats(t);
  if(t>=43.95&&t<52.1)sOrbit(t);
  if(t>=51.95)sFinale(t);
  post(t);
}
window.render=render;
window.ready=Promise.all([`700 20px ${F.d}`,`500 20px ${F.d}`,`italic 400 20px ${F.s}`,`400 20px ${F.m}`,`600 20px ${F.m}`].map(f=>document.fonts.load(f))).then(()=>document.fonts.ready);

/* live preview (skipped when driven by the renderer) */
const q=new URLSearchParams(location.search);
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);const r=document.getElementById('root');r.style.transform=`scale(${s})`}
if(!q.has('render')){addEventListener('resize',fit);fit();
  window.ready.then(()=>{if(q.has('t')){render(parseFloat(q.get('t')));return}const st=performance.now();const loop=()=>{render(((performance.now()-st)/1000)%DURATION);requestAnimationFrame(loop)};loop()})}
</script>
