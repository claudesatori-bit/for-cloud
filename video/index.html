<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Streamline Workflows Film</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html,body{margin:0;background:#EFEBE1;overflow:hidden}
  #root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#EFEBE1;transform-origin:0 0}
  #root canvas{position:absolute;left:0;top:0}
</style>
</head>
<body>
<div id="root">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <canvas id="fx" width="1920" height="1080"></canvas>
</div>
<script>
/* =====================================================================
   STREAMLINE WORKFLOWS — 60s brand film.
   Story = the mark: scattered nodes -> one row resolved.
   Every frame is a pure function of t.
   ===================================================================== */
const W=1920,H=1080,CX=960,CY=540,DURATION=60;
const bgC=document.getElementById('bg'),fxC=document.getElementById('fx');
const bg=bgC.getContext('2d'),fx=fxC.getContext('2d');

/* Brand guidelines v1.0 */
const B={forest:'#1E3B2C',cream:'#EFEBE1',ember:'#C2410C',sage:'#8FBF9F',ink:'#1A1A17',slate:'#4A4A42',rule:'#DED8CA',paper:'#F7F4EC',muted:'#7A7A6E',white:'#FFFFFF'};
const F={a:'Archivo',s:'"Instrument Serif"',m:'"JetBrains Mono"'};
const COPY={url:'streamline-workflows-site.vercel.app'};

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,k)=>a+(b-a)*k;
const inv=(a,b,x)=>clamp((x-a)/(b-a));
const frac=x=>x-Math.floor(x);
const E={
  lin:x=>x,inQuad:x=>x*x,
  inCubic:x=>x*x*x,outCubic:x=>1-(1-x)**3,inOutCubic:x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2,
  outQuart:x=>1-(1-x)**4,outQuint:x=>1-(1-x)**5,
  outExpo:x=>x>=1?1:1-2**(-10*x),inExpo:x=>x<=0?0:2**(10*x-10),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?2**(20*x-10)/2:(2-2**(-20*x+10))/2,
  outBack:x=>{const c1=1.25,c3=c1+1;return 1+c3*(x-1)**3+c1*(x-1)**2},
  inOutSine:x=>-(Math.cos(Math.PI*x)-1)/2,
};
const spring=(a,f=1.6,d=7)=>a<=0?0:1-Math.exp(-d*a)*Math.cos(f*Math.PI*2*a);
const hash=n=>frac(Math.sin(n*127.1+311.7)*43758.5453);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function A(h,a){const[r,g,b]=rgb(h);return`rgba(${r},${g},${b},${a})`}
function mix(h1,h2,k,a=1){const p=rgb(h1),q=rgb(h2);return`rgba(${p.map((v,i)=>Math.round(lerp(v,q[i],clamp(k)))).join(',')},${a})`}

/* ---------- type ---------- */
function font(ctx,size,fam=F.a,weight=400,italic=false,ls=0){ctx.font=`${italic?'italic ':''}${weight} ${size}px ${fam}`;ctx.letterSpacing=ls+'px'}
function measure(ctx,str,o){font(ctx,o.size,o.fam||F.a,o.weight??400,o.italic,o.ls||0);return ctx.measureText(str).width}
function reveal(ctx,str,x,y,o){
  const{size=100,fam=F.a,weight=400,italic=false,ls=0,fill=B.ink,align='left',t0=0,st=.03,dur=.8,rise=1.05,
    ez=E.outQuint,out=null,outDur=.45,outSt=.012,clip=true,alpha=1,t=T}=o;
  font(ctx,size,fam,weight,italic,ls);
  const w=ctx.measureText(str).width;
  const x0=align==='center'?x-w/2:align==='right'?x-w:x;
  if(t<t0-.01)return w;
  ctx.save();
  if(clip){ctx.beginPath();ctx.rect(x0-size,y-size*1.08,w+size*2,size*1.42);ctx.clip()}
  ctx.fillStyle=fill;ctx.textBaseline='alphabetic';ctx.textAlign='left';
  for(let i=0;i<str.length;i++){
    const ch=str[i];if(ch===' ')continue;
    const xi=x0+ctx.measureText(str.slice(0,i)).width;
    const p=ez(inv(t0+i*st,t0+i*st+dur,t));
    let dy=(1-p)*size*rise,a=clamp(p*1.5);
    if(out!=null){const q=E.inCubic(inv(out+i*outSt,out+i*outSt+outDur,t));dy-=q*size*rise;a*=1-q}
    if(a<=.002)continue;
    ctx.globalAlpha=a*alpha;ctx.fillText(ch,xi,y+dy);
  }
  ctx.restore();return w;
}
/* several styled runs on one line, centred */
function runs(ctx,parts,cx,y,common){
  const ws=parts.map(p=>measure(ctx,p.s,{...common,...p}));const tot=ws.reduce((a,b)=>a+b,0);let x=cx-tot/2;
  parts.forEach((p,i)=>{reveal(ctx,p.s,x,y,{...common,...p});x+=ws[i]});return tot;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function dot(ctx,x,y,r,col,a=1){if(r<=.05||a<=0)return;const ga=ctx.globalAlpha;ctx.globalAlpha=ga*a;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=ga}
function pill(ctx,l,r_,y,h,col,a=1){if(r_-l<.5||a<=0)return;const ga=ctx.globalAlpha;ctx.globalAlpha=ga*a;ctx.fillStyle=col;rr(ctx,l,y-h/2,Math.max(h,r_-l),h,h/2);ctx.fill();ctx.globalAlpha=ga}

/* ---------- the mark (viewBox 100: nodes r7 at cols 18/44/70, rows 22/50/78; bar 37→84) ---------- */
const MK_DOTS=[[18,22],[44,22],[70,22],[18,50],[18,78],[44,78],[70,78]];
function lockGeom(ctx,size,cx,cy){
  const S=size*.76/44, tw=measure(ctx,'Streamline',{size,weight:700,ls:-size*.035}), gap=size*28/44;
  const total=73*S+gap+tw, left=cx-total/2;     // mark's visual box spans units 11..84
  return{S,size,cy,mx:left+39*S,my:cy,textX:left+73*S+gap};
}
function drawLockText(ctx,G,t0,{out=null,t=T,name=B.forest,sub=B.muted}={}){
  const size=G.size;
  reveal(ctx,'Streamline',G.textX,G.cy-.1*size,{size,weight:700,ls:-size*.035,fill:name,t0,st:.035,dur:.8,out,t});
  reveal(ctx,'WORKFLOWS',G.textX+2,G.cy+.37*size,{size:size*.341,fam:F.m,ls:size*.341*.3,fill:sub,t0:t0+.35,st:.04,dur:.6,out:out!=null?out+.05:null,t});
}
function drawMark(ctx,M0x,M0y,S,{dotCol=B.forest,barCol=B.ember,sc=[1,1,1,1,1,1,1],barL=37,barR=84,alpha=1}={}){
  MK_DOTS.forEach(([u,v],i)=>dot(ctx,M0x+(u-50)*S,M0y+(v-50)*S,7*S*sc[i],dotCol,alpha));
  if(barR>barL)pill(ctx,M0x+(barL-50)*S,M0x+(barR-50)*S,M0y,14*S,barCol,alpha);
}

/* ---------- grain ---------- */
const GRAIN=[...Array(6)].map((_,k)=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const d=g.createImageData(256,256);const r=rng(99+k);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return c});
let T=0,FI=0;

/* =====================================================================
   GROUND — cream / forest, with slit, iris and wipe transitions
   ===================================================================== */
const SLIT_Y=CY-30;
function onForest(t){return(t>=21.15&&t<41.0)||(t>=47.65&&t<53.7)}
function drawBG(t){
  bg.setTransform(1,0,0,1,0,0);bg.globalAlpha=1;
  bg.fillStyle=B.cream;bg.fillRect(0,0,W,H);
  bg.fillStyle=B.forest;
  if(t>=20.9&&t<41.4){
    if(t<21.45){const h=H*1.2*E.inOutExpo(inv(20.9,21.45,t));bg.fillRect(0,SLIT_Y-h/2,W,h)}else bg.fillRect(0,0,W,H);
    if(t>=40.6){bg.fillStyle=B.cream;bg.beginPath();bg.arc(CX,CY,E.inOutExpo(inv(40.6,41.4,t))*1200,0,7);bg.fill()}
  }
  if(t>=47.35&&t<54.0){
    if(t<47.95){const k=E.inOutExpo(inv(47.35,47.95,t));bg.fillRect(0,H*(1-k),W,H*k)}
    else if(t<53.4)bg.fillRect(0,0,W,H);
    else{const h=H*(1-E.inOutExpo(inv(53.4,54.0,t)));const c=CY-70*E.inOutExpo(inv(53.35,54.25,t));bg.fillRect(0,c-h/2,W,h)}
  }
}

/* =====================================================================
   01 PROBLEM (0–12s) + 02 FIX (12–17s) + IDENTITY (17–21.4s)
   one continuous node system
   ===================================================================== */
const NA=(()=>{const r=rng(5);return[...Array(72)].map((_,i)=>({bx:140+r()*(W-280),by:130+r()*(H-260),ax:30+r()*80,ay:30+r()*70,fx:.25+r()*.5,fy:.25+r()*.5,p:r()*6.28,
  t0:i===0?.3:.75+3.1*(i/72)**.75+r()*.08}))})();
NA[0].bx=CX;NA[0].by=CY-40;NA[0].ax=NA[0].ay=10;
function posA(n,t){const tt=t+.11*Math.max(0,t-5)**2;return[n.bx+Math.sin(tt*n.fx+n.p)*n.ax,n.by+Math.cos(tt*n.fy+n.p*1.3)*n.ay]}
const CHIPS=[
  {s:'Quotes rebuilt by hand in three systems',t0:7.55,x:150,y:170},
  {s:'No single source for job status',t0:7.95,x:1290,y:220},
  {s:'Reporting assembled the night before',t0:8.35,x:170,y:820},
  {s:'The same order, retyped. Again.',t0:8.75,x:1270,y:870},
  {s:'Approvals waiting in an inbox',t0:9.15,x:780,y:980},
];
// grid (3 × 9) in mark units; S=7.5 px/unit, unit 50 at (420, CY)
const G0={S:7.5,mx:420,my:CY};
function halo(ctx,x,y,w,h,a,col=B.cream){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.shadowColor=col;ctx.shadowBlur=70;ctx.fillStyle=col;ctx.fillRect(x,y,w,h);ctx.restore()}

function sNodes(t){
  const G=lockGeom(fx,118,CX,SLIT_Y);
  // ---- grid parameters (grid condenses into the mark)
  const k1=E.inOutExpo(inv(16.3,17.25,t));
  const S=lerp(G0.S,G.S,k1),mx=lerp(G0.mx,G.mx,k1),my=lerp(G0.my,G.my,k1);
  const rPx=lerp(15,7*G.S,k1),rU=rPx/S;
  const P=(u,v)=>[mx+(u-50)*S,my+(v-50)*S];
  // fused bar head (units)
  let barR=-1;
  if(t>=14.85){barR=lerp(44+rU,226+rU,E.inOutCubic(inv(14.85,16.0,t)));barR=lerp(barR,84,E.inOutCubic(inv(16.05,16.75,t)))}
  // ---- A: tangled network
  if(t<12.7){
    const pts=NA.map(n=>posA(n,Math.min(t,12)));
    const la=(1-inv(12.0,12.5,t));
    bg.lineWidth=1.3;
    for(let i=0;i<pts.length;i++){if(t<NA[i].t0)continue;for(let j=i+1;j<pts.length;j++){if(t<NA[j].t0)continue;
      const d=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]);if(d>190)continue;
      const g=Math.min(inv(NA[i].t0,NA[i].t0+.4,t),inv(NA[j].t0,NA[j].t0+.4,t));
      bg.strokeStyle=A(B.slate,(1-d/190)*.38*la*g);bg.beginPath();bg.moveTo(pts[i][0],pts[i][1]);bg.lineTo(pts[j][0],pts[j][1]);bg.stroke()}}
  }
  // ---- nodes: A positions → grid slots → mark
  for(let i=0;i<NA.length;i++){
    const n=NA[i];if(t<n.t0)continue;
    const pop=clamp(spring(t-n.t0,1.5,7),0,1.25);
    const s=i%27,row=Math.floor(s/9),col=s%9,u=18+26*col,v=[22,50,78][row];
    const ta=12.0+col*.05+row*.025,tb=ta+.75;
    const q=E.outBack(inv(ta,tb,t));
    const a0=posA(n,Math.min(t,12));const[gx,gy]=P(u,v);
    let x=lerp(a0[0],gx,q),y=lerp(a0[1],gy,q);
    let r=lerp(9*pop,rPx,E.outCubic(inv(ta,tb,t)));
    let al=1;
    if(i>=27){al=1-inv(tb-.25,tb,t);if(al<=0)continue}
    else{
      const wv=Math.exp(-((col-(t-13.4)*11)**2)/1.5);if(t>13.4&&t<14.6)r*=1+.35*wv;   // ripple
      if(v===50&&col>=1&&barR>0)r*=t>=16.0?0:1-inv(u-rU-6,u+2,barR);                         // absorbed by the bar
      if(v!==50&&col>=3)r*=1-E.inCubic(inv(16.0+(8-col)*.045,16.28+(8-col)*.045,t)); // extra columns leave
      if(t>=20.1){const mi={0:0,1:1,2:2,9:3,18:4,19:5,20:6}[s]??0;r*=1-E.inCubic(inv(20.1+mi*.03,20.4+mi*.03,t))}
    }
    dot(bg,x,y,r,B.forest,al);
  }
  // ---- the fused bar
  if(barR>0&&t<21.45){
    let L=P(44-rU,50)[0],R=P(barR,50)[0];
    const ke=E.inOutExpo(inv(20.35,20.9,t));L=lerp(L,-60,ke);R=lerp(R,W+60,ke);
    const hPx=2*rPx*lerp(1,.5,ke);
    pill(bg,L,R,my,hPx,B.ember,1-inv(21.05,21.4,t));
  }
  // ---- copy
  if(t<5.2){
    const w=measure(fx,'Your business already works.',{size:132,fam:F.s});
    halo(fx,CX-w/2-30,CY-120,w+60,170,.85*inv(1.1,1.6,t)*(1-inv(4.6,5.0,t)));
    reveal(fx,'Your business already works.',CX,CY+20,{size:132,fam:F.s,fill:B.ink,align:'center',t0:1.25,st:.022,dur:.9,out:4.55,t});
  }
  if(t>4.9&&t<7.9){
    const parts=[{s:'It just works '},{s:'too hard',italic:true},{s:'.',fill:B.ember}];
    const tot=parts.map(p=>measure(fx,p.s,{size:132,fam:F.s,italic:p.italic})).reduce((a,b)=>a+b);
    halo(fx,CX-tot/2-30,CY-120,tot+60,170,.85*inv(4.9,5.3,t)*(1-inv(7.3,7.7,t)));
    runs(fx,parts.map((p,i)=>({...p,t0:5.0+.4*i})),CX,CY+20,{size:132,fam:F.s,fill:B.ink,st:.03,dur:.9,out:7.25,t});
  }
  // chips of specifics
  CHIPS.forEach((c,ci)=>{
    if(t<c.t0||t>12.4)return;
    const a=t-c.t0,s=clamp(spring(a,1.3,7),0,1.15),out=inv(11.75,12.15,t);
    font(fx,22,F.a,500);const tw=fx.measureText(c.s).width;const w=tw+86,h=58;
    const x=c.x,y=c.y+Math.sin(t*1.3+ci)*4;
    if(c.n==null){let bd=1e9;NA.forEach((n,k)=>{if(k>=27||n.t0>c.t0)return;const[px,py]=posA(n,c.t0);const d=Math.hypot(px-(x+w/2),py-(y+h/2));if(d<bd){bd=d;c.n=k}})}
    const[nx,ny]=posA(NA[c.n],Math.min(t,12));
    fx.save();fx.globalAlpha=clamp(a*6)*(1-out);
    fx.strokeStyle=A(B.slate,.6);fx.lineWidth=1.2;fx.beginPath();fx.moveTo(nx,ny);fx.lineTo(x+(nx<x?0:w),y+h/2);fx.stroke();
    fx.strokeStyle=B.ember;fx.lineWidth=2;fx.beginPath();fx.arc(nx,ny,16+4*Math.sin(a*6),0,7);fx.stroke();
    fx.translate(x+w/2,y+h/2);fx.scale(lerp(.92,1,s),lerp(.92,1,s));
    fx.shadowColor='rgba(30,59,44,.12)';fx.shadowBlur=24;fx.shadowOffsetY=8;fx.fillStyle=B.white;fx.fillRect(-w/2,-h/2,w,h);fx.shadowColor='transparent';
    fx.strokeStyle=B.rule;fx.lineWidth=1;fx.strokeRect(-w/2+.5,-h/2+.5,w-1,h-1);
    font(fx,14,F.m,500,false,1.5);fx.fillStyle=B.ember;fx.fillText('0'+(ci+1),-w/2+22,7);
    font(fx,22,F.a,500,false,-.3);fx.fillStyle=B.ink;fx.fillText(c.s,-w/2+64,8);
    fx.restore();
  });
  if(t>9.7&&t<12.3){
    const w=measure(fx,'Nine hours a week,',{size:150,fam:F.s});
    halo(fx,CX-w/2-40,CY-140,w+80,260,.9*inv(9.7,10.1,t)*(1-inv(11.8,12.2,t)));
    reveal(fx,'Nine hours a week,',CX,CY+10,{size:150,fam:F.s,fill:B.forest,align:'center',t0:9.85,st:.03,dur:.9,out:11.75,t});
    reveal(fx,'lost to re-entry.',CX,CY+90,{size:44,weight:500,ls:-1,fill:B.slate,align:'center',t0:10.35,st:.02,dur:.7,out:11.8,t});
  }
  // the fix
  reveal(fx,'We find the hours',CX,CY-285,{size:96,fam:F.s,fill:B.ink,align:'center',t0:13.25,st:.03,dur:.9,out:15.95,t});
  reveal(fx,'and give them back.',CX,CY+340,{size:96,fam:F.s,fill:B.ink,align:'center',t0:14.2,st:.03,dur:.9,out:16.0,t});
  // identity
  if(t>16.9&&t<21){
    drawLockText(fx,G,17.05,{out:20.05,t});
    reveal(fx,'Fewer moving parts.',CX,SLIT_Y+215,{size:76,fam:F.s,fill:B.ink,align:'center',t0:18.25,st:.035,dur:.9,out:20.1,t});
  }
}

/* =====================================================================
   03 WHAT WE DO (21.4–41s) — on forest
   ===================================================================== */
const PIL=[
  {t0:24.5,t1:29.6,n:'01',title:'Process automation.',d:['Every role, every repetitive handoff.','We find the hours and give them back.']},
  {t0:30.0,t1:35.1,n:'02',title:'Product development.',d:['Web-based tools built around how the','business actually runs, not a template.']},
  {t0:35.5,t1:40.3,n:'03',title:'360° digital marketing.',d:['Demand, brand and measurement handled','as one system rather than three vendors.']},
];
function sPillars(t){
  if(t<24.6){
    const L=[["We automate the work that shouldn't need people,",21.55],['build the tools that should exist,',22.25],['and run the marketing that makes the rest count',22.95]];
    L.forEach(([s,t0],i)=>{
      if(i<2)reveal(fx,s,CX,CY-100+i*105,{size:74,fam:F.s,fill:B.cream,align:'center',t0,st:.012,dur:.8,out:24.05+i*.06,outSt:.004,t});
      else runs(fx,[{s},{s:'.',fill:B.ember}],CX,CY-100+i*105,{size:74,fam:F.s,fill:B.cream,t0,st:.012,dur:.8,out:24.17,outSt:.004,t});
    });
  }
  for(const P of PIL){
    if(t<P.t0-.05||t>P.t1+.8)continue;
    const x=140,o=P.t1;
    reveal(fx,`PILLAR ${P.n}`,x,330,{size:17,fam:F.m,weight:500,ls:2.4,fill:B.sage,t0:P.t0,st:.02,dur:.5,out:o,t});
    reveal(fx,P.title,x,462,{size:98,fam:F.s,fill:B.cream,t0:P.t0+.08,st:.025,dur:.85,out:o+.02,t});
    P.d.forEach((l,i)=>reveal(fx,l,x+2,552+i*44,{size:29,fill:A(B.cream,.78),t0:P.t0+.35+i*.12,st:.007,dur:.6,out:o+.05+i*.03,outSt:.003,t}));
    const va=E.outCubic(inv(P.t0+.1,P.t0+.7,t))*(1-E.inCubic(inv(o,o+.5,t)));
    if(va>0){fx.save();fx.globalAlpha=va;[pAuto,pProduct,pMarketing][+P.n-1](t,P);fx.restore()}
  }
  const pa=inv(24.4,24.8,t)*(1-inv(40.2,40.6,t));
  if(pa>0)for(let i=0;i<3;i++){const f=inv(PIL[i].t0,PIL[i].t1,t);fx.globalAlpha=pa;fx.fillStyle=A(B.cream,.18);fx.fillRect(140+i*74,760,60,3);fx.fillStyle=B.sage;fx.fillRect(140+i*74,760,60*f,3);fx.globalAlpha=1}
}
/* Pillar 01 — tangled handoffs straighten into one flow */
const ROLES=['SALES','OPS','FINANCE','CLIENT'];
function pAuto(t,P){
  const xs=[1130,1330,1530,1730],y=580;
  const fuse=E.inOutCubic(inv(27.1,27.8,t));
  const arcs=[[0,1,-170],[1,2,150],[2,0,210],[0,2,-250],[2,3,-140],[1,3,190],[3,1,-120]];
  fx.lineWidth=2;
  arcs.forEach(([a,b,h],i)=>{
    const g=E.outCubic(inv(P.t0+.3+i*.1,P.t0+.9+i*.1,t));if(g<=0)return;
    const x0=xs[a],x1=xs[b];const cxp=(x0+x1)/2,cy=y+h*(1-fuse);
    const Q=s=>[(1-s)**2*x0+2*(1-s)*s*cxp+s*s*x1,(1-s)**2*y+2*(1-s)*s*cy+s*s*y];
    fx.setLineDash([6,8]);fx.lineDashOffset=-t*30;fx.strokeStyle=A(B.cream,.35*(1-fuse));
    fx.beginPath();const N=30;for(let k=0;k<=N*g;k++){const[px,py]=Q(k/N);k?fx.lineTo(px,py):fx.moveTo(px,py)}fx.stroke();fx.setLineDash([]);
    if(fuse<1&&g>=1){const s=clamp(frac(t*.35+i*.23)*1.4);const[px,py]=Q(s);fx.fillStyle=A(B.cream,.7*(1-fuse));fx.fillRect(px-5,py-5,10,10)}
  });
  const wa=inv(25.8,26.1,t)*(1-fuse);
  if(wa>0){fx.save();fx.globalAlpha*=wa;font(fx,14,F.m,500,false,2);fx.fillStyle=B.ember;fx.fillText('WAITING · 2 DAYS',1560,372);fx.strokeStyle=A(B.ember,.8);fx.lineWidth=1.2;fx.beginPath();fx.moveTo(1612,380);fx.lineTo(1570,420);fx.stroke();fx.restore()}
  if(fuse>0){fx.strokeStyle=B.sage;fx.lineWidth=3;fx.beginPath();fx.moveTo(xs[0],y);fx.lineTo(lerp(xs[0],xs[3],fuse),y);fx.stroke();
    for(let k=0;k<9;k++){const s=frac(t*.55+k/9);const px=lerp(xs[0],xs[3],s);if(px>lerp(xs[0],xs[3],fuse))continue;fx.fillStyle=B.cream;fx.fillRect(px-4,y-4,8,8)}}
  xs.forEach((x,i)=>{const s=clamp(spring(t-P.t0-.15-i*.08,1.4,7),0,1.2);dot(fx,x,y,16*s,B.cream);dot(fx,x,y,6*s,B.forest);
    fx.save();fx.globalAlpha*=clamp((t-P.t0-.3-i*.08)*4);font(fx,14,F.m,500,false,2.2);fx.fillStyle=B.sage;fx.textAlign='center';fx.fillText(ROLES[i],x,y+52);fx.restore()});
  font(fx,15,F.m,500,false,2.4);fx.fillStyle=B.sage;
  fx.save();fx.globalAlpha*=1-fuse;fx.fillText('BEFORE — 7 HANDOFFS',1110,300);fx.restore();
  fx.save();fx.globalAlpha*=fuse;fx.fillText('AFTER — ONE FLOW',1110,300);fx.restore();
}
/* Pillar 02 — nodes assemble into a working tool */
function pProduct(t,P){
  const X=1060,Y=250,Wd=720,Hd=520;
  const fr=E.inOutCubic(inv(P.t0+.15,P.t0+.9,t));
  fx.strokeStyle=A(B.cream,.5);fx.lineWidth=1.5;
  const per=2*(Wd+Hd);fx.setLineDash([per*fr,per]);fx.strokeRect(X,Y,Wd,Hd);fx.setLineDash([]);
  fx.fillStyle=A(B.cream,.04*fr);fx.fillRect(X,Y,Wd,Hd);
  if(fr>.5){fx.save();fx.globalAlpha*=inv(.5,1,fr);fx.fillStyle=A(B.cream,.14);fx.fillRect(X,Y+44,Wd,1);
    [0,1,2].forEach(i=>dot(fx,X+22+i*18,Y+22,5,A(B.cream,.5)));font(fx,13,F.m,500,false,2);fx.fillStyle=A(B.cream,.55);fx.fillText('OPERATIONS BOARD',X+90,Y+27);fx.restore()}
  // a block flies in as a node, then opens into its rectangle
  const blk=(i,x,y,w,h)=>{const t0=P.t0+.7+i*.09;const k=E.outQuart(inv(t0,t0+.55,t));if(k<=0)return 0;
    const sx=X+Wd/2+Math.cos(i*2.3)*520,sy=Y+Hd/2+Math.sin(i*1.7)*380;
    const m=E.inOutCubic(inv(.45,1,k)),p=E.outCubic(inv(0,.6,k));
    const cx=lerp(sx,x+w/2,p),cy=lerp(sy,y+h/2,p),ww=lerp(14,w,m),hh=lerp(14,h,m);
    rr(fx,cx-ww/2,cy-hh/2,ww,hh,Math.min(7,hh/2,ww/2)*(1-m)+4*m);
    fx.fillStyle=m<1?mix(B.cream,B.forest,m*.93):A(B.cream,.07);fx.fill();fx.strokeStyle=A(B.cream,.22*m);fx.lineWidth=1.2;fx.stroke();
    return inv(.8,1,k)};
  const h1=blk(0,X+24,Y+62,Wd-48,54);
  if(h1){fx.save();fx.globalAlpha*=h1;font(fx,32,F.s,400);fx.fillStyle=B.cream;fx.fillText('Job status',X+44,Y+100);
    font(fx,13,F.m,500,false,2);fx.fillStyle=B.sage;fx.textAlign='right';fx.fillText('● LIVE · ONE SOURCE',X+Wd-44,Y+95);fx.restore()}
  const swap=E.outCubic(inv(33.55,33.9,t));
  const cards=[['IN PRODUCTION','14'],['AWAITING SIGN-OFF',swap>.5?'2':'3'],['SHIPPED THIS WEEK',swap>.5?'23':'22']];
  cards.forEach(([l,v],i)=>{const cw=(Wd-48-24)/3,x=X+24+i*(cw+12),y=Y+130;const k=blk(1+i,x,y,cw,92);
    if(k){fx.save();fx.globalAlpha*=k;font(fx,11,F.m,500,false,1.6);fx.fillStyle=A(B.cream,.6);fx.fillText(l,x+16,y+26);
      font(fx,38,F.a,700,false,-1);fx.fillStyle=i===1&&swap<.5?B.ember:B.cream;fx.fillText(v,x+16,y+74);fx.restore()}});
  const rows=[['#1042','Quote to production','On track'],['#1043','Awaiting sign-off','Sign-off'],['#1044','Materials ordered','On track'],['#1045','Ready to ship','On track']];
  rows.forEach((r,i)=>{const y=Y+240+i*62;const k=blk(4+i,X+24,y,Wd-48,52);if(!k)return;
    fx.save();fx.globalAlpha*=k;font(fx,15,F.m,500);fx.fillStyle=A(B.cream,.55);fx.fillText(r[0],X+44,y+32);
    font(fx,20,F.a,500);fx.fillStyle=B.cream;fx.fillText(i===1&&swap>.5?'Signed, into production':r[1],X+130,y+33);
    let st=r[2],col=B.sage;if(i===1){st=swap>.5?'On track':'Sign-off';col=swap>.5?B.sage:B.ember}
    font(fx,13,F.m,500,false,1.5);const pw=fx.measureText(st.toUpperCase()).width+36;const px=X+Wd-44-pw;
    fx.strokeStyle=col;fx.lineWidth=1.2;fx.strokeRect(px,y+14,pw,26);dot(fx,px+12,y+27,4,col);fx.fillStyle=col;fx.fillText(st.toUpperCase(),px+22,y+32);
    if(i===1&&t>33.5){const pu=inv(33.55,34.3,t);fx.strokeStyle=A(B.sage,1-pu);fx.lineWidth=2;fx.strokeRect(X+24-pu*8,y-pu*8,Wd-48+pu*16,52+pu*16)}
    fx.restore()});
}
/* Pillar 03 — three separate efforts merge into one 360° system */
function pMarketing(t,P){
  const C=[[1260,440],[1620,440],[1440,720]],labels=['DEMAND','BRAND','MEASUREMENT'];
  const mg=E.inOutCubic(inv(37.7,38.6,t));
  const cx=1440,cy=580;
  for(let g=0;g<3;g++){
    const ox=lerp(C[g][0],cx,mg),oy=lerp(C[g][1],cy,mg),R=lerp(118,210,mg);
    for(let k=0;k<12;k++){
      const own=k/12*6.283+t*(g===1?-.5:.6)+g,glob=(g*12+k)/36*6.283+t*.35;
      const a=lerp(own,glob,mg);const s=clamp(spring(t-P.t0-.3-g*.15-k*.02,1.4,7),0,1.2);
      dot(fx,ox+Math.cos(a)*R,oy+Math.sin(a)*R,7*s,B.cream,.9);
    }
    fx.save();fx.globalAlpha*=(1-mg)*clamp((t-P.t0-.6-g*.15)*3);font(fx,13,F.m,500,false,2.2);fx.fillStyle=B.sage;fx.textAlign='center';fx.fillText(labels[g],C[g][0],C[g][1]+5);fx.restore();
  }
  const sw=E.inOutCubic(inv(38.5,39.5,t));
  if(sw>0){fx.strokeStyle=B.sage;fx.lineWidth=3;fx.lineCap='round';fx.beginPath();fx.arc(cx,cy,250,-Math.PI/2,-Math.PI/2+sw*6.283);fx.stroke()}
  if(mg>.6){const ga=fx.globalAlpha;reveal(fx,'One system.',cx,cy+14,{size:54,fam:F.s,fill:B.cream,align:'center',t0:38.4,st:.03,dur:.7,t,alpha:ga});
    reveal(fx,'360°',cx,cy+56,{size:15,fam:F.m,weight:500,ls:2.4,fill:B.sage,align:'center',t0:38.6,st:.04,dur:.5,t,alpha:ga})}
}

/* =====================================================================
   04 IMPACT (41–47.4s) — cream
   ===================================================================== */
function odometer(ctx,str,x,y,{size,t0,t,out,fill,align='left'}){
  font(ctx,size,F.a,700,false,-size*.04);
  const tot=ctx.measureText(str).width;const x0=align==='center'?x-tot/2:x;let cx=x0;
  ctx.save();ctx.beginPath();ctx.rect(x0-20,y-size*.8,tot+40,size*.98);ctx.clip();ctx.fillStyle=fill;
  const q=out!=null?E.inCubic(inv(out,out+.45,t)):0;
  for(let i=0;i<str.length;i++){const ch=str[i],d=parseInt(ch);const w=ctx.measureText(ch).width;
    const rise=(1-E.outQuint(inv(t0+i*.05,t0+i*.05+.7,t)))*size-q*size*1.1;
    if(!isNaN(d)){const p=E.outExpo(inv(t0,t0+1.6,t));const v=d+(1-p)*30;const base=Math.floor(v),f=v-base;
      for(let k=0;k<2;k++)ctx.fillText(String((base+k)%10),cx,y-f*size*1.2+k*size*1.2+rise)}
    else ctx.fillText(ch,cx,y+rise);
    cx+=w}
  ctx.restore();return tot;
}
function sImpact(t){
  reveal(fx,'Your team spends nine hours a week',CX,CY-60,{size:92,fam:F.s,fill:B.ink,align:'center',t0:41.45,st:.018,dur:.8,out:44.1,outSt:.006,t});
  reveal(fx,'retyping the same order.',CX,CY+45,{size:92,fam:F.s,fill:B.ink,align:'center',t0:41.85,st:.02,dur:.8,out:44.15,outSt:.006,t});
  reveal(fx,"Here's the plan to get those hours back.",CX,CY+150,{size:40,weight:500,ls:-.8,fill:B.slate,align:'center',t0:42.6,st:.012,dur:.6,out:44.2,outSt:.004,t});
  if(t>44.2){
    const out=47.05;
    odometer(fx,'9 hrs',560,CY+40,{size:240,t0:44.3,t,out,fill:B.forest,align:'center'});
    odometer(fx,'6 wks',1360,CY+40,{size:240,t0:44.55,t,out,fill:B.ember,align:'center'});
    reveal(fx,'returned per person, per week',560,CY+120,{size:34,fill:B.slate,align:'center',t0:44.7,st:.01,dur:.6,out,outSt:.004,t});
    reveal(fx,'to first shipped tool',1360,CY+120,{size:34,fill:B.slate,align:'center',t0:44.9,st:.01,dur:.6,out,outSt:.004,t});
    const rl=E.inOutCubic(inv(44.5,45.2,t))*(1-inv(out,out+.3,t));
    fx.fillStyle=B.rule;fx.fillRect(CX-1,CY-190,2,330*rl);
  }
}

/* =====================================================================
   05 ONE LINE THROUGH THE NOISE (47.4–54s) → end card
   ===================================================================== */
const FR=11,FC=22,FS=80;
function sDevice(t){
  const x0=CX-(FC-1)/2*FS,y0=CY-(FR-1)/2*FS,mid=(FR-1)/2;
  const G=lockGeom(fx,104,CX,CY-70);
  const toEnd=E.inOutExpo(inv(53.35,54.25,t));
  const head=t<50.1?-1:lerp(x0+FS+7,x0+(FC-1)*FS+7,E.inOutCubic(inv(50.1,51.0,t)));
  const tw=measure(fx,'One line through the noise.',{size:104,fam:F.s});
  const tm=inv(50.8,51.2,t)*(1-inv(52.7,53.1,t));
  for(let r=0;r<FR;r++)for(let c=0;c<FC;c++){
    const id=r*FC+c;const ap=47.75+hash(id)*.8;if(t<ap)continue;
    const d=Math.abs(r-mid);
    const jt=49.1+d*.07+hash(id+3)*.2,jit=1-E.inOutCubic(inv(jt,jt+.8,t));
    let x=x0+c*FS+jit*(Math.sin(t*2.1+id)*22+Math.sin(t*5.3+id*1.7)*9),y=y0+r*FS+jit*(Math.cos(t*1.8+id*.7)*22+Math.cos(t*4.7+id)*9);
    let rad=7*clamp(spring(t-ap,1.4,7),0,1.2),al=.55*(1-jit*.35*(.5+.5*Math.sin(t*9+id)));
    if(r===mid){if(c===0)al=1;if(c>=1&&head>0)rad*=1-inv(x-14,x+2,head)}
    else al*=1-inv(52.75+hash(id)*.3,53.15+hash(id)*.3,t);
    if(tm>0&&y>CY-265&&y<CY-110&&Math.abs(x-CX)<tw/2+50)al*=1-.88*tm;
    if(r===mid&&c===0){ // becomes the mark's middle-left node
      const tx=G.mx+(18-50)*G.S,ty=G.my;x=lerp(x,tx,toEnd);y=lerp(y,ty,toEnd);rad=lerp(rad,7*G.S,toEnd);
      dot(fx,x,y,rad,mix(B.cream,B.forest,inv(53.55,53.85,t)),t>59.2?1-inv(59.2,59.9,t):1);continue}
    if(r===mid&&t>53.35)continue;
    dot(fx,x,y,rad,B.cream,al);
  }
  if(head>0){
    let L=x0+FS-7,R=head;const my=lerp(CY,G.my,toEnd),h=lerp(14,14*G.S,toEnd);
    L=lerp(L,G.mx+(37-50)*G.S,toEnd);R=lerp(R,G.mx+(84-50)*G.S,toEnd);
    pill(fx,L,R,my,h,B.ember,1-inv(59.2,59.9,t));
  }
  reveal(fx,'One line through the noise.',CX,CY-150,{size:104,fam:F.s,fill:B.cream,align:'center',t0:50.85,st:.03,dur:.9,out:52.7,t});
  if(t>=53.35)sEnd(t,G);
}
function sEnd(t,G){
  const fade=1-inv(59.2,59.9,t);
  const sc=MK_DOTS.map((_,i)=>clamp(spring(t-(53.95+[0,1,2,0,4,5,6][i]*.05),1.5,7),0,1.25));sc[3]=0; // node 3 & bar are carried over
  fx.save();fx.globalAlpha=fade;
  drawMark(fx,G.mx,G.my,G.S,{sc,barR:0});
  reveal(fx,'CONSULTING · AUTOMATION · PRODUCT · MARKETING',CX,CY-275,{size:17,fam:F.m,weight:500,ls:2.6,fill:B.ember,align:'center',t0:54.6,st:.012,dur:.5,t});
  drawLockText(fx,G,54.2,{t});
  reveal(fx,'Fewer moving parts.',CX,CY+120,{size:72,fam:F.s,fill:B.ink,align:'center',t0:55.0,st:.035,dur:.9,t});
  const k=E.outExpo(inv(55.7,56.4,t));
  if(k>0){const label='Book a 30-min audit';font(fx,26,F.a,600,false,-.2);const lw=fx.measureText(label).width;const w=lw+80,h=66,x=CX-w/2,y=CY+188;
    fx.fillStyle=B.forest;fx.fillRect(x,y,w*k,h);
    fx.save();fx.beginPath();fx.rect(x,y,w*k,h);fx.clip();fx.fillStyle=B.cream;fx.fillText(label,x+40,y+42);fx.restore()}
  reveal(fx,COPY.url,CX,CY+330,{size:19,fam:F.m,ls:1,fill:B.muted,align:'center',t0:56.3,st:.01,dur:.5,t});
  fx.restore();
}

/* =====================================================================
   POST — HUD, paper grain, fades
   ===================================================================== */
const CHAPTERS=[[0,'01 — The problem'],[12,'02 — The fix'],[16.9,''],[21.4,'03 — What we do'],[41.3,'04 — Impact'],[47.6,'05 — One line'],[53.4,'']];
function post(t){
  fx.setTransform(1,0,0,1,0,0);bg.setTransform(1,0,0,1,0,0);
  let ch=CHAPTERS[0];for(const c of CHAPTERS)if(t>=c[0])ch=c;
  const ha=inv(.6,1.2,t)*(ch[1]?1:0);
  if(ha>0){const f=onForest(t);const col=f?B.sage:B.muted;
    fx.save();fx.globalAlpha=ha;font(fx,13,F.m,500,false,1.8);fx.fillStyle=col;
    fx.fillText(ch[1].toUpperCase(),72,74);fx.textAlign='right';fx.fillText('STREAMLINE WORKFLOWS',W-72,74);
    fx.fillStyle=f?A(B.cream,.14):B.rule;fx.fillRect(72,H-60,W-144,1);
    fx.fillStyle=f?B.cream:B.forest;fx.fillRect(72,H-61,(W-144)*t/DURATION,3);
    fx.restore()}
  fx.globalAlpha=.035;fx.fillStyle=fx.createPattern(GRAIN[FI%6],'repeat');fx.fillRect(0,0,W,H);fx.globalAlpha=1;
  const blk=Math.max(1-inv(0,.3,t),E.inCubic(inv(59.5,60,t)));if(blk>0){fx.fillStyle=A(B.cream,blk);fx.fillRect(0,0,W,H)}
}

function render(t){
  T=t;FI=Math.round(t*60);
  fx.setTransform(1,0,0,1,0,0);fx.globalAlpha=1;fx.clearRect(0,0,W,H);
  drawBG(t);
  if(t<21.5)sNodes(t);
  if(t>=21.4&&t<41.5)sPillars(t);
  if(t>=41.3&&t<47.6)sImpact(t);
  if(t>=47.3)sDevice(t);
  post(t);
}
window.render=render;
window.ready=Promise.all([`700 20px ${F.a}`,`600 20px ${F.a}`,`500 20px ${F.a}`,`400 20px ${F.a}`,`400 20px ${F.s}`,`italic 400 20px ${F.s}`,`400 20px ${F.m}`,`500 20px ${F.m}`].map(f=>document.fonts.load(f))).then(()=>document.fonts.ready);
const q=new URLSearchParams(location.search);
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);document.getElementById('root').style.transform=`scale(${s})`}
if(!q.has('render')){addEventListener('resize',fit);fit();
  window.ready.then(()=>{if(q.has('t')){render(parseFloat(q.get('t')));return}const st=performance.now();const loop=()=>{render(((performance.now()-st)/1000)%DURATION);requestAnimationFrame(loop)};loop()})}
</script>
