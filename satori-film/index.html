/* =====================================================================
   SATORI CRAFT — 60s brand film, built to Brand Guidelines v1.0.
   Story (from the guidelines): HR tech transformations are confusing for
   months, then clear in an instant. The tangle of a rollout resolves into
   the mark — a lotus opening into a sunrise.
   Colour 60/30/10: neutrals dominate, navy anchors, coral sparks.
   Type: Cambria (Caladea) for headlines and big stats, Calibri (Carlito)
   for body, labels and letter-spaced eyebrows.
   Every frame is a pure function of t. 120 BPM — cuts land on the beat.
   ===================================================================== */
const W=1920,H=1080,CX=960,CY=540,DURATION=60;
const cv=document.getElementById('c'),g=cv.getContext('2d');

const B={navy:'#143A66',navy2:'#1D4674',navy3:'#2A5585',coral:'#EE6F47',char:'#101A2C',char2:'#172338',
  slate:'#5C6B7F',slateL:'#9AA6B5',sand:'#F5EEE3',off:'#FAFAF7',white:'#FFFFFF',rule:'#E6DED1'};
const F={h:'Caladea',b:'Carlito',j:'"WenQuanYi Zen Hei"'};
const COPY={url:'satoricraft.com',cta:'Talk to a practitioner'};

/* logo assets (from the guidelines PDF). Mark centre in the 480×356 lockup: (237,144), r≈95; wordmark rows 272–314. */
const IMG={full:new Image(),white:new Image()};IMG.full.src='assets/logo-full.png';IMG.white.src='assets/logo-white.png';
const LK={cx:237,cy:144,r:95,wy0:268,wy1:318};

/* ---------- math ---------- */
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
const inv=(a,b,v)=>clamp((v-a)/(b-a));
const frac=v=>v-Math.floor(v);
const E={
  lin:v=>v,inCubic:v=>v*v*v,outCubic:v=>1-(1-v)**3,inOutCubic:v=>v<.5?4*v*v*v:1-(-2*v+2)**3/2,
  outQuart:v=>1-(1-v)**4,outQuint:v=>1-(1-v)**5,
  outExpo:v=>v>=1?1:1-2**(-10*v),inExpo:v=>v<=0?0:2**(10*v-10),
  inOutExpo:v=>v<=0?0:v>=1?1:v<.5?2**(20*v-10)/2:(2-2**(-20*v+10))/2,
  outBack:v=>{const c1=1.5,c3=c1+1;return 1+c3*(v-1)**3+c1*(v-1)**2},
  inOutSine:v=>-(Math.cos(Math.PI*v)-1)/2,
};
const spring=(a,f=1.6,d=7)=>a<=0?0:1-Math.exp(-d*a)*Math.cos(f*Math.PI*2*a);
const hash=n=>frac(Math.sin(n*127.1+311.7)*43758.5453);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function A(h,a){const[r,gg,b]=rgb(h);return`rgba(${r},${gg},${b},${a})`}
function mix(h1,h2,k,a=1){const p=rgb(h1),q=rgb(h2);return`rgba(${p.map((v,i)=>Math.round(lerp(v,q[i],clamp(k)))).join(',')},${a})`}

/* ---------- type ---------- */
let T=0,FI=0;
function font(size,fam=F.b,weight=400,italic=false,ls=0){g.font=`${italic?'italic ':''}${weight} ${size}px ${fam}`;g.letterSpacing=ls+'px'}
function measure(str,o){font(o.size,o.fam||F.b,o.weight??400,o.italic,o.ls||0);return g.measureText(str).width}
function txt(str,x,y,o){
  const{size=20,fam=F.b,weight=400,italic=false,ls=0,fill=B.navy,align='left',alpha=1}=o;
  if(alpha<=0)return 0;font(size,fam,weight,italic,ls);g.textAlign=align;g.textBaseline='alphabetic';
  const ga=g.globalAlpha;g.globalAlpha=ga*alpha;g.fillStyle=fill;g.fillText(str,x,y);g.globalAlpha=ga;g.textAlign='left';
  return g.measureText(str).width;
}
function reveal(str,x,y,o){
  const{size=100,fam=F.h,weight=400,italic=false,ls=0,fill=B.navy,align='left',t0=0,st=.03,dur=.8,rise=1.05,
    ez=E.outQuint,out=null,outDur=.45,outSt=.012,clip=true,alpha=1,t=T}=o;
  font(size,fam,weight,italic,ls);
  const w=g.measureText(str).width;
  const x0=align==='center'?x-w/2:align==='right'?x-w:x;
  if(t<t0-.01)return w;
  if(out!=null&&t>out+outDur+str.length*outSt+.05)return w;
  const ga0=g.globalAlpha;g.save();
  if(clip){g.beginPath();g.rect(x0-size,y-size*1.1,w+size*2,size*1.45);g.clip()}
  g.fillStyle=fill;g.textBaseline='alphabetic';g.textAlign='left';
  for(let i=0;i<str.length;i++){
    const ch=str[i];if(ch===' ')continue;
    const xi=x0+g.measureText(str.slice(0,i)).width;
    const p=ez(inv(t0+i*st,t0+i*st+dur,t));
    let dy=(1-p)*size*rise,a=clamp(p*1.5);
    if(out!=null){const q=E.inCubic(inv(out+i*outSt,out+i*outSt+outDur,t));dy-=q*size*rise;a*=1-q}
    if(a<=.002)continue;
    g.globalAlpha=ga0*a*alpha;g.fillText(ch,xi,y+dy);
  }
  g.restore();return w;
}
/* a headline in two colours: navy voice, coral spark (guidelines: second half of a headline) */
function reveal2(parts,cx,y,o){
  const ws=parts.map(p=>measure(p.s,{...o,...p}));let x=cx-ws.reduce((a,b)=>a+b,0)/2;
  parts.forEach((p,i)=>{reveal(p.s,x,y,{...o,...p,t0:(o.t0||0)+(p.dt||0)});x+=ws[i]});
}
const typed=(s,t0,cps,t=T)=>s.slice(0,Math.max(0,Math.floor((t-t0)*cps)));
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function dot(x,y,r,col,a=1){if(r<=.05||a<=0)return;const ga=g.globalAlpha;g.globalAlpha=ga*a;g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalAlpha=ga}
function ring(x,y,r,col,lw,a=1){if(r<=.1||a<=0)return;const ga=g.globalAlpha;g.globalAlpha=ga*a;g.strokeStyle=col;g.lineWidth=lw;g.beginPath();g.arc(x,y,r,0,7);g.stroke();g.globalAlpha=ga}
function check(x,y,s,col,lw=3,p=1){g.save();g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.lineJoin='round';
  const pts=[[-.5,0],[-.15,.35],[.55,-.4]];const L1=Math.hypot(.35,.35),L2=Math.hypot(.7,.75),tot=L1+L2;let d=p*tot;
  g.beginPath();g.moveTo(x+pts[0][0]*s,y+pts[0][1]*s);
  if(d<=L1){const k=d/L1;g.lineTo(x+lerp(pts[0][0],pts[1][0],k)*s,y+lerp(pts[0][1],pts[1][1],k)*s)}
  else{g.lineTo(x+pts[1][0]*s,y+pts[1][1]*s);const k=(d-L1)/L2;g.lineTo(x+lerp(pts[1][0],pts[2][0],k)*s,y+lerp(pts[1][1],pts[2][1],k)*s)}
  g.stroke();g.restore()}
function lock(x,y,s,col,closed=1){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=col;g.strokeStyle=col;g.lineWidth=.13;
  rr(-.42,-.05,.84,.62,.1);g.fill();g.beginPath();g.arc(0,-.05-.12*(1-closed),.28,Math.PI,0);g.lineTo(.28,-.05);g.moveTo(-.28,-.05-.12*(1-closed));g.lineTo(-.28,-.05);g.stroke();g.restore()}
function eyebrow(num,label,x,y,{t0=0,fill=B.slate,numFill=B.coral,size=15,align='left',t=T}={}){
  const a=E.outCubic(inv(t0,t0+.4,t));if(a<=0)return;
  const nw=num?measure(num,{size,weight:700,ls:size*.35})+size*1.2:0;const lw=measure(label,{size,weight:700,ls:size*.35});
  const x0=align==='center'?x-(nw+lw)/2:x;
  g.save();g.globalAlpha*=a;g.beginPath();g.rect(x0-4,y-size*1.4,(nw+lw)*E.outQuint(inv(t0,t0+.6,t))+8,size*2);g.clip();
  if(num)txt(num,x0,y,{size,weight:700,ls:size*.35,fill:numFill});txt(label,x0+nw,y,{size,weight:700,ls:size*.35,fill});g.restore();
}

/* =====================================================================
   THE MARK — lotus opening into a sunrise. Vector trace used only while it
   builds; once settled, the approved lockup artwork is shown.
   Unit geometry: circle centre (0,0), centre-line radius 1.
   ===================================================================== */
const MK_LW=.085;
const Q=(p0,c,p1)=>s=>{const u=1-s;return[u*u*p0[0]+2*u*s*c[0]+s*s*p1[0],u*u*p0[1]+2*u*s*c[1]+s*s*p1[1]]};
const L_=(p0,p1)=>s=>[lerp(p0[0],p1[0],s),lerp(p0[1],p1[1],s)];
const ARC=(cx,cy,r,a0,a1)=>s=>{const a=lerp(a0,a1,s);return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
const MK={
  circle:ARC(0,0,1,Math.PI/2,Math.PI/2+Math.PI*2),
  petalL:Q([-.073,.965],[-.132,.045],[-.764,-.174]),petalR:Q([.073,.965],[.132,.045],[.764,-.174]),
  branchL:Q([-.99,.05],[-.58,.06],[-.47,.4]),branchR:Q([.99,.05],[.58,.06],[.47,.4]),
  sun:ARC(0,.2,.27,Math.PI+.13,Math.PI*2-.13),
  rayC:L_([0,-.07],[0,-.72]),rayL:L_([-.13,-.04],[-.42,-.53]),rayR:L_([.13,-.04],[.42,-.53]),
};
const MK_DOTS=[[-.425,.47],[.425,.47]];
function strokePath(fn,cx,cy,r,p0,p1,col,lw,cap='butt'){
  if(p1<=p0)return;const n=Math.max(2,Math.ceil(60*(p1-p0)));
  g.strokeStyle=col;g.lineWidth=lw;g.lineCap=cap;g.lineJoin='round';g.beginPath();
  for(let i=0;i<=n;i++){const[u,v]=fn(lerp(p0,p1,i/n));const X=cx+u*r,Y=cy+v*r;i?g.lineTo(X,Y):g.moveTo(X,Y)}g.stroke();
}
/* k: 0→1 build progress. order: 'lotus' (circle first) or 'sun' (sun first) */
function markV(cx,cy,r,k,{navy=B.navy,coral=B.coral,order='lotus',alpha=1}={}){
  if(k<=0||alpha<=0)return;
  const lw=r*MK_LW;g.save();g.globalAlpha*=alpha;
  const S=order==='sun'?{sun:[0,.25],ray:[.18,.5],petal:[.3,.7],branch:[.5,.85],dot:[.8,.95],circle:[.35,1]}
                      :{circle:[0,.45],petal:[.2,.6],branch:[.4,.7],dot:[.65,.8],sun:[.6,.85],ray:[.75,1]};
  const P=([a,b])=>E.inOutCubic(inv(a,b,k));
  const pc=P(S.circle);
  if(pc>0){strokePath(MK.circle,cx,cy,r,.5-pc/2,.5+pc/2,navy,lw)}
  const pp=P(S.petal);strokePath(MK.petalL,cx,cy,r,0,pp,navy,lw);strokePath(MK.petalR,cx,cy,r,0,pp,navy,lw);
  const pb=P(S.branch);strokePath(MK.branchL,cx,cy,r,0,pb,navy,lw);strokePath(MK.branchR,cx,cy,r,0,pb,navy,lw);
  const pd=clamp(spring(k-S.dot[0],1.2,7)*(k>S.dot[0]?1:0),0,1.2);MK_DOTS.forEach(([u,v])=>dot(cx+u*r,cy+v*r,r*.085*pd,navy));
  // sun rises: arc grows from its centre outwards, lifting slightly
  const ps=P(S.sun);if(ps>0){g.save();g.beginPath();g.arc(cx,cy,r,0,7);g.clip();const lift=(1-ps)*r*.25;
    strokePath(MK.sun,cx,cy+lift,r,.5-ps/2,.5+ps/2,coral,lw);g.restore()}
  const pr=P(S.ray);[['rayC',0],['rayL',.12],['rayR',.12]].forEach(([n,d])=>{const q=E.outCubic(inv(d,d+.88,pr));strokePath(MK[n],cx,cy,r,0,q,coral,lw)});
  g.restore();
}
/* approved lockup artwork: mark centre at (mx,my), scale s (1 = mark radius 95px) */
function lockupImg(mx,my,s,{variant='full',alpha=1,markA=1,wordP=1}={}){
  const im=variant==='white'?IMG.white:IMG.full;if(!im.complete||alpha<=0)return;
  const x0=mx-LK.cx*s,y0=my-LK.cy*s;
  g.save();g.globalAlpha*=alpha;
  if(markA>0){g.save();g.globalAlpha*=markA;g.drawImage(im,0,0,480,LK.wy0-8,x0,y0,480*s,(LK.wy0-8)*s);g.restore()}
  if(wordP>0){const wx0=x0+40*s,ww=400*s;g.save();g.beginPath();g.rect(wx0,y0+(LK.wy0-4)*s,ww*wordP,(LK.wy1-LK.wy0+10)*s);g.clip();
    const lift=(1-E.outQuint(wordP))*14*s;g.drawImage(im,0,LK.wy0-4,480,LK.wy1-LK.wy0+10,x0,y0+(LK.wy0-4)*s+lift,480*s,(LK.wy1-LK.wy0+10)*s);g.restore()}
  g.restore();
}

const GRAIN=[...Array(6)].map((_,k)=>{const c=document.createElement('canvas');c.width=c.height=256;const gg=c.getContext('2d');const d=gg.createImageData(256,256);const r=rng(99+k);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}gg.putImageData(d,0,0);return c});

/* =====================================================================
   DATA — every cue time lives here; cues.js exports them for the score.
   ===================================================================== */
const count=t=>Math.round(90*(1-E.inCubic(inv(.6,3.5,t))));
const CHIPS=['Payroll parallel run','Leave policies','Data migration','UAT sign-off','Integrations','Training','Statutory reports','Cut-over plan'];
const SLAMS=[[4.0,'Payroll','A'],[4.5,'Leave','C'],[5.0,'Attendance','A'],[5.5,'Onboarding','D'],[6.0,'Performance','B'],
  [6.5,'Compensation','A'],[7.0,'Compliance','C'],[7.5,'Data migration','A'],[8.0,'Integrations','D'],[8.5,'UAT, round four','B'],
  [9.0,'Change requests','A'],[9.5,'Adoption?','C'],[10.0,'Go-live moved','X'],[10.5,'Again','A'],[11.0,'Who owns this?','D']];
const CARDS=[[4.25,330,250,'Payroll mismatch','214 rows · March cycle'],[4.9,1500,800,'UAT round 4 failed','12 open defects'],
  [5.6,1520,230,'Go-live moved','+3 weeks'],[6.3,330,820,'leave_policy_v7_FINAL.xlsx','edited by 6 people'],

const SAT={cx:CX,cy:430,r:190};           // the mark at its moment of clarity
const MORPH=[12.1,13.25];                 // tangle → mark
const TRIPLE=[[19.5,'Not assembly.'],[20.0,'Not theatre.'],[20.5,'Craft.']];
const MODULES=['Core HR','Onboarding','Attendance','Leave','Payroll','Performance','Compensation','Recruitment','Learning',
  'Engagement','Helpdesk','Travel','Expenses','Separation','Workflows','Analytics','Talent'];
const CFG=MODULES.map((_,i)=>22.45+i*.19);
const PHASES=['Discover','Design','Configure','Migrate','Test','Go-live'];
const PH_T=PHASES.map((_,k)=>26.9+k*.3);
const TICKETS=[['#2381','Payroll cycle — March'],['#2382','New joiner bulk upload'],['#2383','Leave policy change · UAE'],
  ['#2384','Integration · GL export'],['#2385','Attendance rule · night shift'],['#2386','Performance cycle launch'],
  ['#2387','Statutory report · PF / ESI'],['#2388','Release regression check']];
const TK_T=TICKETS.map((_,i)=>30.55+i*.5),TK_R=TK_T.map(v=>v+1.1),TK_M=['12m','8m','21m','34m','9m','16m','11m','27m'];
const SVC=[[34.5,'Implement.'],[35.0,'Run.'],[35.5,'Extend with AI.']];
const MSG=[{t0:36.35,who:'user',role:'HRBP · Sales',s:'Which of my team are at attrition risk?'},
  {t0:37.45,who:'agent',s:'3 people in Sales. Here is why.'},
  {t0:38.6,who:'user',role:'Manager · Sales',s:'Show me salaries for Finance.'},
  {t0:39.65,who:'agent',s:'That is outside your access.',lock:true}];
const ROWS=['Sales','Finance','Sales','Ops','Finance','Sales','HR','Finance','Ops','Sales'];
const LOCK_T=ROWS.map((d,i)=>d==='Finance'?39.7+i*.06:null).filter(v=>v!=null);
const STAMP=40.7;
const PANES=[{e:42.6,from:[-1,0],bg:B.navy,num:'300+',lab:'enterprise engagements',fg:B.coral,sub:B.slateL},
  {e:42.95,from:[0,-1],bg:B.coral,num:'100+',lab:'HRMS rollouts personally led',fg:B.navy,sub:A(B.navy,.8)},
  {e:43.3,from:[0,1],bg:B.sand,num:'56+',lab:'combined years in HR tech',fg:B.coral,sub:B.slate},
  {e:43.65,from:[1,0],bg:B.off,num:'95%+',lab:'on-time delivery',fg:B.navy,sub:B.slate}];
const PANE_OUT=46.35;
const MAPX=lon=>180+(lon-40)/85*1560,MAPY=lat=>900-(lat+10)/45*760;
const HOME={n:'Bengaluru',lon:77.6,lat:13.0};
const CITIES=[['Dubai',55.3,25.2],['Riyadh',46.7,24.7],['Doha',51.5,25.3],['Mumbai',72.9,19.1],['Delhi',77.2,28.6],
  ['Bangkok',100.5,13.7],['Kuala Lumpur',101.7,3.1],['Singapore',103.8,1.35],['Jakarta',106.8,-6.2],['Manila',121,14.6]]
  .map(([n,lon,lat],i)=>({n,x:MAPX(lon),y:MAPY(lat),t0:49.85+i*.2}));
const HX=MAPX(HOME.lon),HY=MAPY(HOME.lat);
const END={s:1.3,my:330};                  // end-card lockup: scale and mark centre

/* =====================================================================
   SCENES
   ===================================================================== */
function bgFill(col){g.fillStyle=col;g.fillRect(-60,-60,W+120,H+120)}

/* ---- 0–4: the countdown (charcoal: the problem space) ---- */
function sHook(t){
  const n=count(t),hit=t>=3.5;
  const up=E.inOutCubic(inv(.35,.8,t));const beat=Math.exp(-frac(t*2)*7);const numY=CY+120;
  font(380,F.h,700,false,-10);const nw=g.measureText(String(n)).width;
  const dx=lerp(CX,CX-nw/2-70,up),dy=lerp(CY,numY-300,up);
  dot(dx,dy,lerp(22+10*beat,14+5*beat,up)*clamp(spring(t+.08,1.4,8),0,1.3),B.coral);
  ring(dx,dy,30+beat*40,B.coral,2,beat*.5*(1-up*.6));
  reveal('HRMS ROLLOUT  ·  GO-LIVE IN',CX,numY-300+7,{size:20,fam:F.b,weight:700,ls:7,fill:B.slateL,align:'center',t0:.45,st:.015,dur:.5,t});
  if(t>.55){const k=E.outExpo(inv(.55,.95,t));g.save();g.translate(CX,numY);g.scale(lerp(1.25,1,k),lerp(1.25,1,k));
    txt(String(n),0,0,{size:380,fam:F.h,weight:700,ls:-10,fill:hit?B.coral:B.sand,align:'center',alpha:k});g.restore();
    reveal('DAYS',CX,numY+80,{size:24,fam:F.b,weight:700,ls:12,fill:B.slateL,align:'center',t0:.8,st:.03,dur:.5,t})}
  drawChips(t);
}
function chipPos(i,t){
  const t0=1.35+i*.26,a=t-t0;const base=i/CHIPS.length*Math.PI*2+.4;
  const sp=.25+2.2*inv(1.5,11.5,t)**1.6;
  const ang=base+(t-1.35)*sp+Math.sin(t*1.7+i)*.15*inv(4,11,t);
  const R=lerp(1.4,1,E.outQuint(inv(0,.7,a)))*(500+Math.sin(i*2.3)*60)*(1+.08*Math.sin(t*3+i));
  const ex=E.inExpo(inv(11.2,11.8,t));
  return{x:CX+Math.cos(ang)*R*(1+ex*1.6),y:CY+30+Math.sin(ang)*R*.62*(1+ex*1.6),a:clamp(a*4)*(1-ex)};
}
function drawChips(t){
  CHIPS.forEach((s,i)=>{const p=chipPos(i,t);if(p.a<=0)return;
    font(22,F.b,400,false,.3);const w=g.measureText(s).width+50;
    g.save();g.globalAlpha=p.a*(t>4?.6:.95);rr(p.x-w/2,p.y-23,w,46,23);g.fillStyle=B.char2;g.fill();g.strokeStyle=A(B.slateL,.3);g.lineWidth=1.5;g.stroke();
    dot(p.x-w/2+19,p.y,4.5,i%3===0?B.coral:B.slateL);txt(s,p.x-w/2+33,p.y+7,{size:22,fill:B.sand});g.restore()});
}

/* ---- 4–12: the noise ---- */
const NET=(()=>{const r=rng(21);const nodes=[...Array(17)].map(()=>({x:120+r()*1680,y:110+r()*860,f:r()*6}));

/* ---- 42.6–49: proof ---- */
function odoDigit(str,x,y,size,t0,dur,fill,t){

    if(/\d/.test(ch)){const d=+ch,spins=2+i;const p=E.outQuart(inv(t0+i*.07,t0+dur+i*.07,t));const v=d-spins*10*(1-p);
      const lo=Math.floor(v),f_=v-lo,lh=size*.98;
      g.save();g.beginPath();g.rect(cx-6,y-size*.84,cw+12,size*1.02);g.clip();g.fillStyle=fill;
      g.fillText(String(((lo%10)+10)%10),cx,y+f_*lh);g.fillText(String((((lo+1)%10)+10)%10),cx,y+f_*lh-lh);g.restore()}
    else{g.save();g.globalAlpha*=E.outCubic(inv(t0+dur*.5,t0+dur*.8,t));g.fillStyle=fill;g.fillText(ch,cx,y);g.restore()}
    cx+=cw}
}
function sProof(t){

    g.fillStyle=P.bg;g.fillRect(qx,qy,W/2,H/2);
    const cx=qx+W/4,cy=qy+H/4;

  }
}

/* ---- 49–54: reach (sand) ---- */
const FIELD=(()=>{const pts=[];for(let y=90;y<1000;y+=24)for(let x=60;x<1880;x+=24){let v=0;
  for(const c of [...CITIES,{x:HX,y:HY}])v=Math.max(v,Math.exp(-((x-c.x)**2+(y-c.y)**2)/(2*110*110)));
  const nz=.5+.25*Math.sin(x*.011+y*.007)+.25*Math.sin(x*.004-y*.013+2);v*=clamp(nz*1.6-.2);
  pts.push({x,y,v,d:Math.hypot(x-HX,y-HY)})}return pts})();
function arcPt(c,s){const mx=(HX+c.x)/2,my=(HY+c.y)/2-Math.hypot(c.x-HX,c.y-HY)*.38;const u=1-s;return[u*u*HX+2*u*s*mx+s*s*c.x,u*u*HY+2*u*s*my+s*s*c.y]}
function endSun(){const s=END.s;return{x:CX,y:END.my+MK.sun(.5)[1]*LK.r*s+LK.r*s*.02,r:LK.r*s}}
function sReach(t){

  CITIES.forEach(c=>{const p=E.inOutCubic(inv(c.t0,c.t0+.7,t));if(p<=0)return;
    g.strokeStyle=A(B.coral,.9*fa+.1);g.lineWidth=2.6;g.beginPath();const s1=p*(1-outK);let q=arcPt(c,0);g.moveTo(q[0],q[1]);
    for(let i=1;i<=40;i++){q=arcPt(c,s1*i/40);g.lineTo(q[0],q[1])}g.stroke();
    if(p<1)dot(q[0],q[1],5,B.coral);
    if(p>=1){const a=t-c.t0-.7;dot(c.x,c.y,6*clamp(spring(a,1.4,7),0,1.3),B.navy,fa);ring(c.x,c.y,8+a*60,B.navy,1.5,clamp(1-a*1.5)*fa);
      txt(c.n.toUpperCase(),c.x+14,c.y-12,{size:15,weight:700,ls:3,fill:B.navy,alpha:inv(0,.3,a)*.85*fa})}});
  g.restore();
  // Bengaluru becomes the sunrise at the heart of the end-card mark
  const S=endSun();const hk=E.inOutCubic(inv(53.2,54.0,t));
  const hx=lerp(HX,S.x,hk),hy=lerp(HY,S.y,hk);
  dot(hx,hy,lerp(9,S.r*.06,hk)+Math.exp(-frac(t*2)*7)*3*(1-hk),B.coral,clamp((t-49.05)*5));
  if(hk<.3)txt('BENGALURU  ·  HQ',hx+18,hy+32,{size:15,weight:700,ls:3,fill:B.coral,alpha:inv(49.3,49.6,t)*(1-hk*3.3)});
  g.save();g.globalAlpha=1-outK;
  reveal('Middle East',330,445,{size:64,fam:F.h,italic:true,fill:B.navy,align:'center',t0:50.3,st:.03,dur:.7});
  reveal('India',700,640,{size:64,fam:F.h,italic:true,fill:B.navy,align:'center',t0:50.8,st:.03,dur:.7});
  reveal('Southeast Asia',1600,720,{size:64,fam:F.h,italic:true,fill:B.navy,align:'center',t0:51.3,st:.03,dur:.7});
  reveal2([{s:'One practitioner team. ',fill:B.navy},{s:'Three regions.',fill:B.coral,dt:.3}],CX,990,{size:58,fam:F.h,t0:51.85,st:.018,dur:.7});
  g.restore();
}

/* =====================================================================
   POST + TIMELINE
   ===================================================================== */
const CHAPTERS=[[21,'01','Implement'],[30,'02','Run'],[36,'03','Governed AI'],[42.6,'04','By the numbers'],[49,'05','Reach'],[53.8,'','']];
const dark=t=>t<12||(t>=21&&t<29.9)||(t>=35.5&&t<42.9);
function post(t,whipV){
  g.setTransform(1,0,0,1,0,0);
  if(whipV>0){g.save();for(let k=1;k<=5;k++){g.globalAlpha=.22;g.drawImage(cv,-whipV*k/5,0)}g.restore()}
  let gi=0;
  if(t>3.35&&t<4.05)gi=Math.max(gi,inv(3.35,4,t)*.8);
  if(t>10.6&&t<11.45)gi=Math.max(gi,inv(10.6,11.4,t));
  for(const[s]of SLAMS){const a=t-s;if(a>=0&&a<.07)gi=Math.max(gi,.45)}
  if(gi>0){for(let i=0;i<Math.round(3+gi*10);i++){const y=hash(FI*13+i)*H,h=6+hash(FI*7+i)*70,dx=(hash(FI*3+i*5)-.5)*200*gi;g.drawImage(cv,0,y,W,h,dx,y,W,h)}
    g.fillStyle=A(B.coral,.1*gi);g.fillRect(0,hash(FI)*H,W,4+hash(FI+1)*30)}
  for(const[t0,amp,col,dec]of[[12,1,B.off,5],[21,.35,B.off,6],[STAMP,.3,B.coral,6],[54,.6,B.off,5]]){const a=t-t0;if(a<0||a>1.2)continue;g.fillStyle=A(col,amp*Math.exp(-a*dec));g.fillRect(0,0,W,H)}
  // chrome, as in the guidelines deck: eyebrow top-left, name top-right, footer and page count
  let ch=null;for(const c of CHAPTERS)if(t>=c[0])ch=c;
  if(ch&&ch[2]){const d=dark(t);const col=d?A(B.sand,.55):B.slate;
    const ca=inv(ch[0],ch[0]+.4,t);g.save();g.globalAlpha=ca;
    font(13,F.b,700,false,4);g.fillStyle=B.coral;g.fillText(ch[1],72,74);g.fillStyle=col;g.fillText(ch[2].toUpperCase(),72+34,74);
    g.textAlign='right';g.fillText('SATORI CRAFT',W-72,74);
    font(14,F.b,400,false,.3);g.textAlign='left';g.fillStyle=col;g.fillText('Satori Craft   ·   AI-First HR Tech Services',72,H-52);
    g.textAlign='right';g.fillText(`${ch[1]} / 05`,W-72,H-52);g.textAlign='left';g.restore()}
  if(dark(t)){const v=g.createRadialGradient(CX,CY,H*.4,CX,CY,H*1.05);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(4,10,20,.35)');g.fillStyle=v;g.fillRect(0,0,W,H)}
  g.globalAlpha=dark(t)?.04:.028;g.fillStyle=g.createPattern(GRAIN[FI%6],'repeat');g.fillRect(0,0,W,H);g.globalAlpha=1;
  const bo=E.inCubic(inv(59.4,60,t));if(bo>0){g.fillStyle=A(B.off,bo);g.fillRect(0,0,W,H)}
}

function render(t){
  T=t;FI=Math.round(t*60);
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.clearRect(0,0,W,H);
  let sh=0;if(t>4&&t<11.5){sh=1.5+14*inv(8,11.4,t)**2;for(const[s]of SLAMS){const a=t-s;if(a>=0&&a<.4)sh+=9*Math.exp(-a*14)}}
  if(t>=STAMP&&t<STAMP+.5)sh+=26*Math.exp(-(t-STAMP)*9);
  for(const[s]of TRIPLE){const a=t-s;if(a>=0&&a<.4)sh+=8*Math.exp(-a*14)}
  const sx=(hash(FI*1.3)-.5)*sh,sy=(hash(FI*2.7)-.5)*sh;
  g.setTransform(1,0,0,1,sx,sy);
  let whipV=0;
  if(t<4){bgFill(B.char);sHook(t)}
  else if(t<12){bgFill(B.char);sChaos(t)}
  else if(t<16)sSatori(t);
  else if(t<21)sIdentity(t);
  else if(t<30){
    const wk=E.inExpo(inv(29.55,30,t));sImplement(t,-wk*W);
    if(t>29.55){const rk=1-E.outExpo(inv(29.8,30.35,t));g.save();g.beginPath();g.rect(W*(1-wk),-60,W+120,H+120);g.clip();sRun(Math.max(t,30),rk*W*.4);g.restore()}
    whipV=Math.max(0,wk-.02)*160;
  }
  else if(t<36){const rk=1-E.outExpo(inv(29.8,30.35,t));sRun(t,rk*W*.4);whipV=rk*120;if(t>=34.5){if(t<35.5)bgFill(B.off);sServices(t)}}
  else if(t<43.3){sAI(t);if(t>=42.6)sProof(t)}
  else if(t<49)sProof(t);
  else if(t<54)sReach(t);
  else sEnd(t);
  post(t,whipV);
}
window.render=render;

window.ready=Promise.all([...[`700 20px ${F.h}`,`400 20px ${F.h}`,`italic 400 20px ${F.h}`,`700 20px ${F.b}`,`400 20px ${F.b}`,`italic 400 20px ${F.b}`,`400 20px ${F.j}`].map(f=>document.fonts.load(f,'悟りSatori')),...imgReady]).then(()=>document.fonts.ready);

if(!q.has('render')){addEventListener('resize',fit);fit();
